name: Reusable - Cosign Sign Image

on:
  workflow_call:
    inputs:

      service-name:
        description: "Service Name"
        required: true
        type: string

      runner:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest

      image-with-digest:
        description: "Complete ECR image reference with digest"
        required: true
        type: string

      aws-region:
        description: "AWS Region"
        required: true
        type: string

      aws-ecr-role-arn:
        description: "Complete AWS ECR Role ARN"
        required: true
        type: string

jobs:

  Sign-Image:
    name: Sign Image with Cosign
    runs-on: ${{ inputs.runner }}

    permissions:
      contents: read
      id-token: write

    steps:

      # ============================================================
      # 01. Verify AWS CLI
      # ============================================================
      - name: Verify AWS CLI
        shell: bash
        run: |
          set -euo pipefail

          aws --version

      # ============================================================
      # 02. Configure AWS credentials
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws-ecr-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      # ============================================================
      # 03. Verify AWS identity
      # ============================================================
      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

      # ============================================================
      # 04. Login to Amazon ECR
      # ============================================================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ============================================================
      # 05. Verify image reference
      # ============================================================
      - name: Verify image reference
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Cosign Image Signing"
          echo "=================================================="

          echo "Service:"
          echo "${{ inputs.service-name }}"

          echo ""
          echo "Image:"
          echo "${{ inputs.image-with-digest }}"

          if [[ "${{ inputs.image-with-digest }}" != *@sha256:* ]]; then
            echo "::error::Image reference must use an immutable sha256 digest."
            exit 1
          fi

      # ============================================================
      # 06. Install Cosign
      # ============================================================
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # ============================================================
      # 07. Verify Cosign installation
      # ============================================================
      - name: Verify Cosign
        shell: bash
        run: |
          set -euo pipefail

          cosign version

      # ============================================================
      # 08. Cosign keyless sign
      #
      # GitHub OIDC
      #       ↓
      # Fulcio short-lived certificate
      #       ↓
      # Rekor transparency log
      #       ↓
      # Signature attached to exact image digest
      # ============================================================
      - name: Cosign - Sign image
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Signing exact image digest"
          echo "=================================================="

          echo "Image:"
          echo "${{ inputs.image-with-digest }}"

          cosign sign \
            --yes \
            "${{ inputs.image-with-digest }}"

          echo ""
          echo "Cosign signing completed successfully."

      # ============================================================
      # 09. Verify signature was created for the exact digest
      #
      # This verifies that the signature is attached to the image
      # reference supplied above.
      #
      # Identity restrictions remain enforced by your Kyverno
      # admission policy in the cluster.
      # ============================================================
      - name: Verify Cosign signature
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Verifying Cosign signature"
          echo "=================================================="

          cosign verify \
            --certificate-oidc-issuer-regexp '^https://token.actions.githubusercontent.com$' \
            --certificate-identity-regexp '.*' \
            "${{ inputs.image-with-digest }}"

          echo ""
          echo "Cosign signature verification completed successfully."
