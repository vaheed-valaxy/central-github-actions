name: Reusable - Cosign Sign Image

on:
  workflow_call:
    inputs:

      service-name:
        description: "Service Name"
        required: true
        type: string

      runner:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest

      image-with-digest:
        description: "Complete ECR image reference with digest"
        required: true
        type: string

      aws-region:
        description: "AWS Region"
        required: true
        type: string

      aws-ecr-role-arn:
        description: "AWS IAM role used to access PROD ECR"
        required: true
        type: string

      cosign-certificate-identity-regexp:
        description: "Expected Sigstore certificate identity regexp"
        required: true
        type: string

      cosign-oidc-issuer:
        description: "Expected OIDC issuer for keyless Cosign signing"
        required: false
        type: string
        default: https://token.actions.githubusercontent.com


jobs:

  Sign-Image:
    name: Sign Image with Cosign
    runs-on: ${{ inputs.runner }}

    permissions:
      contents: read
      id-token: write

    steps:

      # ------------------------------------------------------------
      # 1. Verify AWS CLI
      # ------------------------------------------------------------
      - name: Verify AWS CLI
        run: |
          aws --version

      # ------------------------------------------------------------
      # 2. Configure AWS credentials
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-ecr-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      # ------------------------------------------------------------
      # 3. Verify AWS identity
      # ------------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------------
      # 4. Login to PROD ECR
      # ------------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------------
      # 5. Install Cosign
      # ------------------------------------------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # ------------------------------------------------------------
      # 6. Display signing information
      # ------------------------------------------------------------
      - name: Display signing information
        run: |
          echo "Service:"
          echo "${{ inputs.service-name }}"

          echo "Image:"
          echo "${{ inputs.image-with-digest }}"

          echo "Expected certificate identity:"
          echo "${{ inputs.cosign-certificate-identity-regexp }}"

          echo "Expected OIDC issuer:"
          echo "${{ inputs.cosign-oidc-issuer }}"

      # ------------------------------------------------------------
      # 7. Check whether a valid expected signature already exists
      # ------------------------------------------------------------
      - name: Check existing Cosign signature
        id: verify-signature
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ inputs.image-with-digest }}"

          echo "Checking for an existing valid Cosign signature..."
          echo "Image: $IMAGE"

          if cosign verify \
            --certificate-identity-regexp="${{ inputs.cosign-certificate-identity-regexp }}" \
            --certificate-oidc-issuer="${{ inputs.cosign-oidc-issuer }}" \
            "$IMAGE" >/tmp/cosign-verify-output.json 2>/tmp/cosign-verify-error.log
          then
            echo "A valid expected Cosign signature already exists."
            echo "Skipping signing."

            echo "signature-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No valid expected Cosign signature was found."
            echo "Image requires signing."

            echo "signature-exists=false" >> "$GITHUB_OUTPUT"

            if [[ -s /tmp/cosign-verify-error.log ]]; then
              echo "Cosign verification output:"
              cat /tmp/cosign-verify-error.log
            fi
          fi
         





      # ------------------------------------------------------------
      # TEMPORARY OIDC DEBUG - DELETE AFTER DEBUGGING
      # ------------------------------------------------------------
      - name: Debug signing OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "OIDC claims used by Cosign signing workflow"
          echo "=================================================="

          echo "OIDC issuer:"
          echo "$ACTIONS_ID_TOKEN_REQUEST_URL"

          echo
          echo "Requesting OIDC token..."

          OIDC_TOKEN=$(curl \
            --fail \
            --silent \
            --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            | jq -r '.value')

          if [[ -z "$OIDC_TOKEN" || "$OIDC_TOKEN" == "null" ]]; then
            echo "::error::Failed to obtain GitHub OIDC token."
            exit 1
          fi

          echo "OIDC token obtained successfully."
          echo

          echo "JWT header:"
          echo "$OIDC_TOKEN" | cut -d '.' -f 1 | base64 -d 2>/dev/null | jq .

          echo
          echo "JWT payload:"
          echo "$OIDC_TOKEN" | cut -d '.' -f 2 | base64 -d 2>/dev/null | jq .




          
      # ------------------------------------------------------------
      # 8. Sign only when the required signature does not exist
      # ------------------------------------------------------------
      - name: Cosign - Sign image
        if: steps.verify-signature.outputs.signature-exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ inputs.image-with-digest }}"

          echo "Signing image:"
          echo "$IMAGE"

          cosign sign --yes "$IMAGE"

          echo "Image signing completed."

      # --------------------
      # This should be deleted later
      # ----------------------
      - name: Verify final Cosign signature
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ inputs.image-with-digest }}"

          echo "Verifying final signature state..."
          
          cosign verify \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "$IMAGE"

      # ------------------------------------------------------------
      # 9. Verify final state
      # ------------------------------------------------------------
      # - name: Verify final Cosign signature
      #   shell: bash
      #   run: |
      #     set -euo pipefail

      #     IMAGE="${{ inputs.image-with-digest }}"

      #     echo "Verifying final signature state..."

      #     cosign verify \
      #       --certificate-identity-regexp="${{ inputs.cosign-certificate-identity-regexp }}" \
      #       --certificate-oidc-issuer="${{ inputs.cosign-oidc-issuer }}" \
      #       "$IMAGE" >/dev/null

      #     echo "Valid Cosign signature confirmed for:"
      #     echo "$IMAGE"
