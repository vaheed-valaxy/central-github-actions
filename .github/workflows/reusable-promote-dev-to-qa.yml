name: Reusable Promote to QA

# Promotes the image digest currently defined for DEV in GitOps
# to the QA ECR repository and opens a QA GitOps PR.
#
# No image rebuild occurs.
#
# Flow:
#
# 1. Checkout GitOps into _gitops
# 2. Install yq
# 3. Check DEV values
# 4. Check QA values
# 5. Read DEV digest
# 6. Validate digest
# 7. AWS OIDC
# 8. Get AWS account
# 9. Verify DEV ECR
# 10. Find DEV SHA tag
# 11. Install Crane
# 12. Login Crane
# 13. Promote DEV → QA
# 14. Verify QA digest
# 15. Create or reuse GitOps branch
# 16. Update QA values
# 17. Git diff
# 18. Commit
# 19. Push
# 20. Create or reuse QA PR
#
# QA Argo CD will deploy the image after the PR is merged.

on:
  workflow_call:
    inputs:

      service-name:
        description: "Service to promote"
        required: true
        type: string

      gitops-repo:
        description: "GitOps repository name"
        required: true
        type: string

      gitops-owner:
        description: "GitHub owner of the GitOps repository"
        required: true
        type: string

      dev-ecr-repo:
        description: "DEV ECR repository"
        required: true
        type: string

      qa-ecr-repo:
        description: "QA ECR repository"
        required: true
        type: string

      aws-region:
        description: "AWS region"
        required: true
        type: string

      aws-ecr-qa-promotion-role-arn:
        description: "AWS IAM role ARN used for DEV to QA ECR promotion"
        required: true
        type: string

    secrets:
      GITOPS_TOKEN:
        description: "Token used to checkout, push, and create PRs in the GitOps repository"
        required: true

permissions:
  contents: read
  id-token: write

env:
  SERVICE: ${{ inputs.service-name }}

  GITOPS_OWNER: ${{ inputs.gitops-owner }}
  GITOPS_REPO: ${{ inputs.gitops-repo }}
  GITOPS_DIR: "_gitops"

  DEV_ECR_REPO: ${{ inputs.dev-ecr-repo }}
  QA_ECR_REPO: ${{ inputs.qa-ecr-repo }}

  AWS_REGION: ${{ inputs.aws-region }}
  AWS_ECR_QA_PROMOTION_ROLE_ARN: ${{ inputs.aws-ecr-qa-promotion-role-arn }}

  CRANE_VERSION: v0.21.7
  YQ_VERSION: "v4.47.1"

  DEV_VALUES_FILE: "envs/dev/values-${{ inputs.service-name }}.yaml"
  QA_VALUES_FILE: "envs/qa/values-${{ inputs.service-name }}.yaml"

concurrency:
  group: promote-dev-to-qa-${{ inputs.service-name }}
  cancel-in-progress: false
  
jobs:

  Promote-Dev-to-QA-Job:
    name: Promote DEV image to QA
    runs-on: ubuntu-latest
    steps:          
      # ============================================================
      # 1. Checkout GitOps Repository
      # ============================================================
      - name: Checkout GitOps Repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.gitops-owner }}/${{ inputs.gitops-repo }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: ${{ env.GITOPS_DIR }}
          fetch-depth: 0

      # ============================================================
      # 2. Install yq
      # ============================================================
      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail

          wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"

          chmod +x /usr/local/bin/yq

          yq --version

      # ============================================================
      # 3. Ensure DEV Values file exists
      # ============================================================
      - name: Ensure DEV values file exists
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$DEV_VALUES_FILE" ]]; then
            echo "::error::DEV values file not found: ${DEV_VALUES_FILE}"
            echo "::error::Cannot determine DEV image digest."
            exit 1
          fi

      # ============================================================
      # 4. Ensure QA Values file exists
      # ============================================================
      - name: Ensure QA values file exists
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$QA_VALUES_FILE" ]]; then
            echo "::error::QA values file not found: ${QA_VALUES_FILE}"
            echo "::error::Create $QA_VALUES_FILE in $GITOPS_REPO."
            exit 1
          fi

      # ============================================================
      # 5. Read Image DIGEST from DEV
      # ============================================================
      - name: Read image DIGEST from DEV
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          DEV_IMAGE_DIGEST="$(yq e '.image.digest' "$DEV_VALUES_FILE")"

          if [[ -z "$DEV_IMAGE_DIGEST" || "$DEV_IMAGE_DIGEST" == "null" ]]; then
            echo "::error::Could not read .image.digest from $DEV_VALUES_FILE"
            exit 1
          fi

          echo "DEV_IMAGE_DIGEST=$DEV_IMAGE_DIGEST" >> "$GITHUB_ENV"

          echo "=================================================="
          echo "DEV image information"
          echo "=================================================="
          echo "Service : $SERVICE"
          echo "Dev Image Digest  : $DEV_IMAGE_DIGEST"

      # ============================================================
      # 6. Validate DEV Image DIGEST
      # ============================================================
      - name: Validate image digest
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Validating image digest"
          echo "=================================================="

          if [[ ! "$DEV_IMAGE_DIGEST" =~ ^sha256:[a-fA-F0-9]{64}$ ]]; then
            echo "::error::Invalid image digest"
            echo "Received: $DEV_IMAGE_DIGEST"
            exit 1
          fi

          echo "Digest is valid:"
          echo "$DEV_IMAGE_DIGEST"

      # ============================================================
      # 7. Configure AWS using GitHub OIDC
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ECR_QA_PROMOTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================================
      # 8. Get AWS Account ID
      # ============================================================
      - name: Get AWS account ID
        id: aws-account
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          echo "account-id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

          echo "AWS Account: $ACCOUNT_ID"

      # ============================================================
      # 9. Verify DEV image exists in ECR
      # ============================================================
      - name: Verify DEV image exists in ECR
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Checking DEV ECR image"
          echo "=================================================="

          aws ecr describe-images \
            --repository-name "$DEV_ECR_REPO" \
            --image-ids imageDigest="$DEV_IMAGE_DIGEST" \
            --region "$AWS_REGION" \
            >/dev/null

          echo "DEV image exists."
          echo "Repository: $DEV_ECR_REPO"
          echo "Digest:     $DEV_IMAGE_DIGEST"

      # ============================================================
      # 10. Find the original SHA tag from DEV
      # ============================================================
      - name: Find DEV image tag
        id: image-info
        shell: bash
        run: |
          set -euo pipefail

          TAGS="$(aws ecr describe-images \
            --repository-name "$DEV_ECR_REPO" \
            --image-ids imageDigest="$DEV_IMAGE_DIGEST" \
            --query 'imageDetails[0].imageTags' \
            --output text \
            --region "$AWS_REGION")"

          echo "DEV tags:"
          echo "$TAGS"

          DEV_IMAGE_TAG="$(echo "$TAGS" | tr '\t' '\n' | grep '^sha-' | head -n 1 || true)"

          if [[ -z "$DEV_IMAGE_TAG" ]]; then
            echo "::error::No sha-* tag found for digest"
            exit 1
          fi

          echo "dev-image-tag=$DEV_IMAGE_TAG" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Selected Service:"
          echo "$SERVICE"

          echo ""
          echo "Selected DEV image tag:"
          echo "$DEV_IMAGE_TAG"

          echo ""
          echo "Selected DEV image digest:"
          echo "$DEV_IMAGE_DIGEST"

      # ============================================================
      # 11. Install Crane
      # ============================================================
      - name: Install Crane
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Installing Crane $CRANE_VERSION"
          echo "=================================================="

          curl -sL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            -o /tmp/go-containerregistry.tar.gz

          tar -xzf \
            /tmp/go-containerregistry.tar.gz \
            -C /tmp

          sudo mv /tmp/crane /usr/local/bin/crane

          crane version

      # ============================================================
      # 12. Login Crane to ECR
      # ============================================================
      - name: Login Crane to ECR
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.aws-account.outputs.account-id }}
        run: |
          set -euo pipefail

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "Logging into:"
          echo "$REGISTRY"

          aws ecr get-login-password \
            --region "$AWS_REGION" |
            crane auth login \
              "$REGISTRY" \
              --username AWS \
              --password-stdin

      # ============================================================
      # 13. Promote exact digest DEV → QA
      # ============================================================
      # Rerun-safe behavior:
      #
      # - QA tag does not exist:
      #     Copy exact DEV digest to QA.
      #
      # - QA tag exists with same digest:
      #     Promotion already completed; continue.
      #
      # - QA tag exists with different digest:
      #     Fail to prevent tag collision.
      
      - name: Promote exact image digest
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.aws-account.outputs.account-id }}
          DEV_IMAGE_TAG: ${{ steps.image-info.outputs.dev-image-tag }}
        run: |
          set -euo pipefail
      
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      
          SOURCE="${REGISTRY}/${DEV_ECR_REPO}@${DEV_IMAGE_DIGEST}"
          TARGET="${REGISTRY}/${QA_ECR_REPO}:${DEV_IMAGE_TAG}"
      
          echo "=================================================="
          echo "Promoting image"
          echo "=================================================="
      
          echo "SOURCE:"
          echo "$SOURCE"
      
          echo ""
          echo "TARGET:"
          echo "$TARGET"
      
          set +e
          QA_LOOKUP="$(aws ecr describe-images \
            --repository-name "$QA_ECR_REPO" \
            --image-ids imageTag="$DEV_IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region "$AWS_REGION" 2>&1)"
            
          QA_LOOKUP_EXIT_CODE=$?
          
          set -e
      
          if [[ "$QA_LOOKUP_EXIT_CODE" -eq 0 ]]; then
      
            EXISTING_QA_DIGEST="$QA_LOOKUP"
      
            echo "QA tag already exists."
            echo "Existing QA digest:"
            echo "$EXISTING_QA_DIGEST"
      
            if [[ "$EXISTING_QA_DIGEST" != "$DEV_IMAGE_DIGEST" ]]; then
              echo "::error::QA tag exists but points to a different digest."
              echo "::error::Expected: $DEV_IMAGE_DIGEST"
              echo "::error::Found:    $EXISTING_QA_DIGEST"
              exit 1
            fi
      
            echo "QA already contains the exact same digest."
            echo "Promotion is already complete."
      
          else
      
            if [[ "$QA_LOOKUP" != *"ImageNotFoundException"* ]]; then
              echo "::error::Failed to check whether the QA image exists."
              echo "$QA_LOOKUP"
              exit 1
            fi
      
            echo "QA tag does not exist."
            echo "Copying exact DEV digest to QA..."
      
            crane copy \
              "$SOURCE" \
              "$TARGET"
      
            echo "Image promotion completed."
      
          fi
      
      # ============================================================
      # 14. Verify QA digest matches DEV digest
      # ============================================================
      - name: Verify QA digest matches DEV digest
        shell: bash
        env:
          DEV_IMAGE_TAG: ${{ steps.image-info.outputs.dev-image-tag }}

        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Verifying DEV and QA digests"
          echo "=================================================="

          QA_DIGEST="$(aws ecr describe-images \
            --repository-name "$QA_ECR_REPO" \
            --image-ids imageTag="$DEV_IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --region "$AWS_REGION")"

          echo "DEV digest:"
          echo "$DEV_IMAGE_DIGEST"

          echo ""
          echo "QA digest:"
          echo "$QA_DIGEST"

          if [[ "$QA_DIGEST" != "$DEV_IMAGE_DIGEST" ]]; then
            echo ""
            echo "::error::Digest mismatch!"
            exit 1
          fi

          echo ""
          echo "SUCCESS"
          echo "DEV and QA contain the exact same image digest."

      # ============================================================
      # 15. Create or reuse QA promotion branch
      # ============================================================
      - name: Create QA promotion branch
        working-directory: ${{ env.GITOPS_DIR }}
        id: branch
        shell: bash
        env:
          DEV_IMAGE_TAG: ${{ steps.image-info.outputs.dev-image-tag }}

        run: |
          set -euo pipefail

          BRANCH="promote/${SERVICE}-dev-to-qa-${DEV_IMAGE_TAG}"

          echo "Promotion branch:"
          echo "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # Check whether the branch already exists on origin.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
      
            echo "Branch already exists on origin."
            echo "Fetching existing branch..."
      
            git fetch origin "$BRANCH"
      
            git checkout -B "$BRANCH" "origin/$BRANCH"
      
          else
      
            echo "Branch does not exist."
            echo "Creating new branch..."
      
            git checkout -b "$BRANCH"

            echo "Created branch:"
            echo "$BRANCH"
      
          fi

      # ============================================================
      # 16. Update QA values
      # ============================================================
      - name: Update QA image digest
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Updating QA values"
          echo "=================================================="

          export DIGEST="$DEV_IMAGE_DIGEST"

          yq -i \
            '.image.digest = strenv(DIGEST)' \
            "$QA_VALUES_FILE"

          echo ""
          echo "Updated QA values:"
          cat "$QA_VALUES_FILE"

      # ============================================================
      # 17. Show Git diff
      # ============================================================
      - name: Show Git diff
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "QA GitOps changes"
          echo "=================================================="

          git diff -- "$QA_VALUES_FILE"

          if git diff --quiet -- "$QA_VALUES_FILE"; then
            echo "::error::No QA values change detected."
            exit 1
          fi

      # ============================================================
      # 18. Commit QA promotion
      # ============================================================
      - name: Commit QA promotion
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        env:
          DEV_IMAGE_TAG: ${{ steps.image-info.outputs.dev-image-tag }}

        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add "$QA_VALUES_FILE"

          git commit -m "promote(${SERVICE}): DEV to QA ${DEV_IMAGE_TAG}"

          echo "QA promotion commit created."

      # ============================================================
      # 19. Push promotion branch
      # ============================================================
      - name: Push QA promotion branch
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}

        run: |
          set -euo pipefail

          git push --set-upstream origin "$BRANCH"

          echo "QA promotion branch pushed."

      # ============================================================
      # 20. Create QA promotion PR
      # ============================================================
      - name: Create QA promotion PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          DEV_IMAGE_TAG: ${{ steps.image-info.outputs.dev-image-tag }}

        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Creating/Checking QA promotion PR"
          echo "=================================================="
          
          EXISTING_PR="$(gh pr list \
            --repo "${GITOPS_OWNER}/${GITOPS_REPO}" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number,url \
            --jq '.[0] | "\(.number) \(.url)"')"

          if [[ -n "$EXISTING_PR" ]]; then
            echo "QA promotion PR already exists:"
            echo "$EXISTING_PR"
            echo "Nothing more to create."
            exit 0
          fi
          
          echo "No existing QA promotion PR found."
          echo "Creating PR..."
    
          PR_TITLE="promote(${SERVICE}): DEV → QA"

          PR_BODY="$(cat <<EOF
          ## QA Image Promotion

          Service: \`${SERVICE}\`

          DEV repository: \`${DEV_ECR_REPO}\`

          QA repository: \`${QA_ECR_REPO}\`

          Image tag: \`${DEV_IMAGE_TAG}\`

          Image digest: \`${DEV_IMAGE_DIGEST}\`

          ## Promotion

          \`DEV → QA\`

          ## Verification

          - No image rebuild performed.
          - DEV image exists in ECR.
          - Exact DEV digest copied to QA.
          - QA digest verified to match DEV digest.
          - QA GitOps values updated with the same digest.

          ## QA Security

          QA GitOps CI must pass:

          - Helm validation
          - Trivy configuration scan
          - Kubeconform
          - Kyverno CLI validation
          - Other required GitOps checks

          After merge, Argo CD will deploy the image to QA.

          EOF
          )"

          gh pr create \
            --repo "${GITOPS_OWNER}/${GITOPS_REPO}" \
            --base main \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY"
