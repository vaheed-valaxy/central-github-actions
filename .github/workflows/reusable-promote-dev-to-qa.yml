name: Reusable Promote DEV to QA

on:
  workflow_call:
    inputs:

      service-name:
        description: "Service to promote"
        required: true
        type: string

      dev-values-file:
        description: "DEV Helm values file"
        required: true
        type: string

      qa-values-file:
        description: "QA Helm values file"
        required: true
        type: string

      runner:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest

      gitops-repo:
        description: "GitOps repository name"
        required: true
        type: string

      gitops-owner:
        description: "GitHub owner of the GitOps repository"
        required: true
        type: string

      dev-ecr-repo:
        description: "DEV ECR repository"
        required: true
        type: string

      qa-ecr-repo:
        description: "QA ECR repository"
        required: true
        type: string

      aws-region:
        description: "AWS region"
        required: true
        type: string

      aws-ecr-qa-promotion-role-arn:
        description: "AWS IAM role ARN used for DEV to QA ECR promotion"
        required: true
        type: string

    secrets:
      GITOPS_TOKEN:
        description: "Token used to checkout, push, and create PRs in the GitOps repository"
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  SERVICE: ${{ inputs.service-name }}

  GITOPS_OWNER: ${{ inputs.gitops-owner }}
  GITOPS_REPO: ${{ inputs.gitops-repo }}
  GITOPS_DIR: "_gitops"

  DEV_ECR_REPO: ${{ inputs.dev-ecr-repo }}
  QA_ECR_REPO: ${{ inputs.qa-ecr-repo }}

  AWS_REGION: ${{ inputs.aws-region }}
  AWS_ECR_QA_PROMOTION_ROLE_ARN: ${{ inputs.aws-ecr-qa-promotion-role-arn }}

  CRANE_VERSION: v0.21.7
  YQ_VERSION: "v4.47.1"

  DEV_VALUES_FILE: ${{ inputs.dev-values-file }}
  QA_VALUES_FILE: ${{ inputs.qa-values-file }}

concurrency:
  group: promote-dev-to-qa-${{ inputs.gitops-repo }}-${{ inputs.service-name }}
  cancel-in-progress: false

jobs:

  # ================================================================
  # JOB 1
  # Check everything required before image promotion
  # ================================================================
  Promote-Check-Job:
    name: Promotion Prerequisites Check
    runs-on: ${{ inputs.runner }}

    outputs:
      account-id: ${{ steps.aws-account.outputs.account-id }}
      dev-image-tag: ${{ steps.image-info.outputs.dev-image-tag }}
      matched-file-digest-with-dev-ecr: ${{ steps.check-file-digest-with-dev-ecr.outputs.matched-file-digest-with-dev-ecr }}
      qa-image-already-exists: ${{ steps.qa-ecr-check.outputs.qa-image-already-exists }}
      qa-already-current: ${{ steps.compare-digests.outputs.qa-already-current }}

    steps:

      # ============================================================
      # 01. Checkout GitOps Repository
      # ============================================================
      - name: Checkout GitOps Repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.gitops-owner }}/${{ inputs.gitops-repo }}
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: ${{ env.GITOPS_DIR }}
          fetch-depth: 0


      # ============================================================
      # 02. Install yq
      # ============================================================
      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Installing yq $YQ_VERSION"
          echo "=================================================="

          wget -qO /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"

          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

          yq --version


      # ============================================================
      # 03. Ensure DEV values file exists
      # ============================================================
      - name: Ensure DEV values file exists
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$DEV_VALUES_FILE" ]]; then
            echo "::error::DEV values file not found: $DEV_VALUES_FILE"
            echo "::error::Cannot determine DEV image digest."
            exit 1
          fi

          echo "DEV values file found:"
          echo "$DEV_VALUES_FILE"


      # ============================================================
      # 04. Ensure QA values file exists
      # ============================================================
      - name: Ensure QA values file exists
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$QA_VALUES_FILE" ]]; then
            echo "::error::QA values file not found: $QA_VALUES_FILE"
            echo "::error::Create this file in the GitOps repository."
            exit 1
          fi

          echo "QA values file found:"
          echo "$QA_VALUES_FILE"


      # ============================================================
      # 05. Read DEV Image DIGEST
      # ============================================================
      - name: Read image DIGEST from DEV
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          DEV_FILE_DIGEST="$(yq -r '.image.digest // ""' "$DEV_VALUES_FILE")"

          if [[ -z "$DEV_FILE_DIGEST" || "$DEV_FILE_DIGEST" == "null" ]]; then
            echo "::error::Could not read .image.digest from $DEV_VALUES_FILE"
            exit 1
          fi

          if [[ ! "$DEV_FILE_DIGEST" =~ ^sha256:[a-fA-F0-9]{64}$ ]]; then
            echo "::error::Invalid DEV image digest."
            echo "Received: $DEV_FILE_DIGEST"
            exit 1
          fi

          echo "=================================================="
          echo "DEV image information"
          echo "=================================================="
          echo "Service: $SERVICE"
          echo "DEV image digest: $DEV_FILE_DIGEST"

          echo "DEV_FILE_DIGEST=$DEV_FILE_DIGEST" >> "$GITHUB_ENV"


      # ============================================================
      # 06. Read QA Image DIGEST
      # ============================================================
      - name: Read image DIGEST from QA
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          QA_FILE_DIGEST="$(yq -r '.image.digest // ""' "$QA_VALUES_FILE")"

          if [[ -z "$QA_FILE_DIGEST" || "$QA_FILE_DIGEST" == "null" ]]; then

            echo "=================================================="
            echo "QA image information"
            echo "=================================================="
            echo "No QA image digest found."
            echo "This appears to be the first QA promotion."
            echo "Continuing..."

            QA_FILE_DIGEST=""

          else

            if [[ ! "$QA_FILE_DIGEST" =~ ^sha256:[a-fA-F0-9]{64}$ ]]; then
              echo "::error::Invalid QA image digest."
              echo "Received: $QA_FILE_DIGEST"
              exit 1
            fi

            echo "=================================================="
            echo "QA image information"
            echo "=================================================="
            echo "Service: $SERVICE"
            echo "QA image digest: $QA_FILE_DIGEST"

          fi

          echo "QA_FILE_DIGEST=$QA_FILE_DIGEST" >> "$GITHUB_ENV"


      # ============================================================
      # 07. Compare DEV and QA Image DIGEST
      # ============================================================
      - name: Compare DEV and QA image DIGEST
        id: compare-digests
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Comparing DEV and QA image digests"
          echo "=================================================="

          echo "DEV digest:"
          echo "$DEV_FILE_DIGEST"

          echo ""
          echo "QA digest:"
          if [[ -n "$QA_FILE_DIGEST" ]]; then
            echo "$QA_FILE_DIGEST"
          else
            echo "<empty>"
          fi

          # --------------------------------------------------------
          # First QA promotion
          # --------------------------------------------------------
          if [[ -z "$QA_FILE_DIGEST" ]]; then

            echo ""
            echo "QA digest is empty."
            echo "This is the first QA promotion."

            echo "qa-already-current=false" >> "$GITHUB_OUTPUT"
            exit 0

          fi

          # --------------------------------------------------------
          # DEV and QA already contain exactly the same image
          # --------------------------------------------------------
          if [[ "$DEV_FILE_DIGEST" == "$QA_FILE_DIGEST" ]]; then

            echo ""
            echo "DEV and QA already contain the exact same digest."
            echo "No image promotion is required."
            echo "No GitOps PR update is required."

            echo "qa-already-current=true" >> "$GITHUB_OUTPUT"
            exit 0

          fi

          # --------------------------------------------------------
          # DEV contains a newer/different digest
          # --------------------------------------------------------
          echo ""
          echo "DEV and QA contain different image digests."
          echo "QA promotion is required."

          echo "qa-already-current=false" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 08. Configure AWS using GitHub OIDC
      # ============================================================
      - name: Configure AWS credentials
        if: steps.compare-digests.outputs.qa-already-current != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ECR_QA_PROMOTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # 09. Get AWS Account ID
      # ============================================================
      - name: Get AWS account ID
        if: steps.compare-digests.outputs.qa-already-current != 'true'
        id: aws-account
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          if [[ -z "$ACCOUNT_ID" || "$ACCOUNT_ID" == "None" ]]; then
            echo "::error::Unable to determine AWS account ID."
            exit 1
          fi

          echo "AWS Account ID: $ACCOUNT_ID"

          echo "account-id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 10. Verify DEV GitOps digest exists in DEV ECR
      # ============================================================
      - name: Verify DEV GitOps digest exists in DEV ECR
        if: steps.compare-digests.outputs.qa-already-current != 'true'
        id: check-file-digest-with-dev-ecr
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Checking DEV ECR image"
          echo "=================================================="

          if aws ecr describe-images \
               --repository-name "$DEV_ECR_REPO" \
               --image-ids imageDigest="$DEV_FILE_DIGEST" \
               --region "$AWS_REGION" \
               >/dev/null 2>&1; then

            echo "DEV image exists in ECR."
            echo "Repository: $DEV_ECR_REPO"
            echo "Digest: $DEV_FILE_DIGEST"

            echo "matched-file-digest-with-dev-ecr=$DEV_FILE_DIGEST" >> "$GITHUB_OUTPUT"

          else

            echo "::error::DEV GitOps digest does not exist in DEV ECR."
            echo "Repository: $DEV_ECR_REPO"
            echo "Digest: $DEV_FILE_DIGEST"
            echo "::error::Promotion cancelled."

            exit 1

          fi


      # ============================================================
      # 11. Find original SHA tag from DEV
      # ============================================================
      - name: Find DEV image tag
        if: steps.compare-digests.outputs.qa-already-current != 'true'
        id: image-info
        shell: bash
        run: |
          set -euo pipefail

          MATCHED_FILE_DIGEST_WITH_DEV_ECR="${{ steps.check-file-digest-with-dev-ecr.outputs.matched-file-digest-with-dev-ecr }}"

          TAGS="$(aws ecr describe-images \
            --repository-name "$DEV_ECR_REPO" \
            --image-ids imageDigest="$MATCHED_FILE_DIGEST_WITH_DEV_ECR" \
            --query 'imageDetails[0].imageTags' \
            --output text \
            --region "$AWS_REGION")"

          echo "DEV tags:"
          echo "$TAGS"

          DEV_IMAGE_TAG="$(
            echo "$TAGS" |
            tr '\t' '\n' |
            grep '^sha-' |
            head -n 1 ||
            true
          )"

          if [[ -z "$DEV_IMAGE_TAG" ]]; then
            echo "::error::No sha-* tag found for DEV digest."
            echo "Digest: $MATCHED_FILE_DIGEST_WITH_DEV_ECR"
            exit 1
          fi

          echo ""
          echo "Service:"
          echo "$SERVICE"

          echo ""
          echo "Selected DEV image tag:"
          echo "$DEV_IMAGE_TAG"

          echo ""
          echo "Selected DEV image digest:"
          echo "$MATCHED_FILE_DIGEST_WITH_DEV_ECR"

          echo "dev-image-tag=$DEV_IMAGE_TAG" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 12. Check whether exact image already exists in QA ECR
      # ============================================================
      - name: Check QA image
        if: steps.compare-digests.outputs.qa-already-current != 'true'
        id: qa-ecr-check
        shell: bash
        env:
          DEV_IMAGE_TAG: ${{ steps.image-info.outputs.dev-image-tag }}
          MATCHED_FILE_DIGEST_WITH_DEV_ECR: ${{ steps.check-file-digest-with-dev-ecr.outputs.matched-file-digest-with-dev-ecr }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Checking QA ECR image"
          echo "=================================================="

          set +e

          QA_LOOKUP="$(
            aws ecr describe-images \
              --repository-name "$QA_ECR_REPO" \
              --image-ids imageTag="$DEV_IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text \
              --region "$AWS_REGION" \
              2>&1
          )"

          QA_LOOKUP_EXIT_CODE=$?

          set -e

          # --------------------------------------------------------
          # QA tag exists
          # --------------------------------------------------------
          if [[ "$QA_LOOKUP_EXIT_CODE" -eq 0 ]]; then

            EXISTING_QA_DIGEST="$QA_LOOKUP"

            echo "QA tag already exists."
            echo "QA repository: $QA_ECR_REPO"
            echo "QA tag:        $DEV_IMAGE_TAG"
            echo "QA digest:     $EXISTING_QA_DIGEST"
            echo "DEV digest:    $MATCHED_FILE_DIGEST_WITH_DEV_ECR"

            if [[ "$EXISTING_QA_DIGEST" != "$MATCHED_FILE_DIGEST_WITH_DEV_ECR" ]]; then
              echo "::error::QA tag exists but points to a different digest."
              echo "::error::This prevents accidental tag reuse."
              echo "::error::Expected: $MATCHED_FILE_DIGEST_WITH_DEV_ECR"
              echo "::error::Found: $EXISTING_QA_DIGEST"
              exit 1
            fi

            echo ""
            echo "Exact image already exists in QA ECR."
            echo "Image copy can be skipped."

            echo "qa-image-already-exists=true" >> "$GITHUB_OUTPUT"
            exit 0

          fi


          # --------------------------------------------------------
          # QA tag does not exist
          # --------------------------------------------------------
          if [[ "$QA_LOOKUP" == *"ImageNotFoundException"* ]]; then

            echo "QA image tag does not exist yet."
            echo "Image promotion is required."

            echo "qa-image-already-exists=false" >> "$GITHUB_OUTPUT"
            exit 0

          fi


          # --------------------------------------------------------
          # Unexpected AWS error
          # --------------------------------------------------------
          echo "::error::Failed to check QA ECR image."
          echo "$QA_LOOKUP"

          exit 1


  # ================================================================
  # JOB 2
  # Copy exact DEV image digest to QA
  # ================================================================
  Promote-Dev-Image-Qa-Job:
    name: Promote DEV Image to QA
    runs-on: ${{ inputs.runner }}

    needs:
      - Promote-Check-Job

    if: |
      needs.Promote-Check-Job.result == 'success' &&
      needs.Promote-Check-Job.outputs.qa-already-current != 'true' &&
      needs.Promote-Check-Job.outputs.qa-image-already-exists != 'true'

    outputs:
      is-dev-qa-ecr-digest-matched: ${{ steps.check-dev-qa-ecr-match.outputs.is-dev-qa-ecr-digest-matched }}
      matched-dev-qa-ecr-digest: ${{ steps.check-dev-qa-ecr-match.outputs.matched-dev-qa-ecr-digest }}

    steps:

      # ============================================================
      # 01. Configure AWS using GitHub OIDC
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ECR_QA_PROMOTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # 02. Install Crane
      # ============================================================
      - name: Install Crane
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Installing Crane $CRANE_VERSION"
          echo "=================================================="

          curl -fsSL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            -o /tmp/go-containerregistry.tar.gz

          tar -xzf \
            /tmp/go-containerregistry.tar.gz \
            -C /tmp

          sudo mv /tmp/crane /usr/local/bin/crane

          crane version


      # ============================================================
      # 03. Login Crane to ECR
      # ============================================================
      - name: Login Crane to ECR
        shell: bash
        env:
          ACCOUNT_ID: ${{ needs.Promote-Check-Job.outputs.account-id }}
        run: |
          set -euo pipefail

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "Logging into:"
          echo "$REGISTRY"

          aws ecr get-login-password \
            --region "$AWS_REGION" |
            crane auth login "$REGISTRY" \
              --username AWS \
              --password-stdin


      # ============================================================
      # 04. Promote exact digest DEV → QA
      # ============================================================
      - name: Promote exact image digest
        shell: bash
        env:
          ACCOUNT_ID: ${{ needs.Promote-Check-Job.outputs.account-id }}
          DEV_IMAGE_TAG: ${{ needs.Promote-Check-Job.outputs.dev-image-tag }}
          MATCHED_FILE_DIGEST_WITH_DEV_ECR: ${{ needs.Promote-Check-Job.outputs.matched-file-digest-with-dev-ecr }}
        run: |
          set -euo pipefail

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          SOURCE="${REGISTRY}/${DEV_ECR_REPO}@${MATCHED_FILE_DIGEST_WITH_DEV_ECR}"
          TARGET="${REGISTRY}/${QA_ECR_REPO}:${DEV_IMAGE_TAG}"

          echo "=================================================="
          echo "Promoting exact image"
          echo "=================================================="

          echo "SOURCE:"
          echo "$SOURCE"

          echo ""
          echo "TARGET:"
          echo "$TARGET"

          echo ""
          echo "Copying exact DEV digest with exact tag to QA..."

          echo "DEV ECR Tag:"
          echo "$DEV_IMAGE_TAG"

          echo ""
          echo "DEV ECR Digest:"
          echo "$MATCHED_FILE_DIGEST_WITH_DEV_ECR"

          crane copy "$SOURCE" "$TARGET"

          echo ""
          echo "Image promotion completed successfully from DEV to QA."


      # ============================================================
      # 05. Verify QA digest matches DEV digest
      # ============================================================
      - name: Verify QA digest matches DEV digest in ECR
        id: check-dev-qa-ecr-match
        shell: bash
        env:
          DEV_IMAGE_TAG: ${{ needs.Promote-Check-Job.outputs.dev-image-tag }}
          MATCHED_FILE_DIGEST_WITH_DEV_ECR: ${{ needs.Promote-Check-Job.outputs.matched-file-digest-with-dev-ecr }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Verifying DEV and QA digests"
          echo "=================================================="

          QA_DIGEST="$(
            aws ecr describe-images \
              --repository-name "$QA_ECR_REPO" \
              --image-ids imageTag="$DEV_IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text \
              --region "$AWS_REGION"
          )"

          echo ""
          echo "DEV digest:"
          echo "$MATCHED_FILE_DIGEST_WITH_DEV_ECR"

          echo ""
          echo "QA digest:"
          echo "$QA_DIGEST"

          if [[ "$QA_DIGEST" != "$MATCHED_FILE_DIGEST_WITH_DEV_ECR" ]]; then

            echo ""
            echo "::error::Digest mismatch between DEV and QA."
            exit 1

          fi

          echo ""
          echo "SUCCESS"
          echo "DEV and QA contain the exact same image digest."

          echo "DEV ECR Digest: $MATCHED_FILE_DIGEST_WITH_DEV_ECR"
          echo "QA ECR Digest : $QA_DIGEST"

          echo "is-dev-qa-ecr-digest-matched=true" >> "$GITHUB_OUTPUT"
          echo "matched-dev-qa-ecr-digest=$MATCHED_FILE_DIGEST_WITH_DEV_ECR" >> "$GITHUB_OUTPUT"


  # ================================================================
  # JOB 3
  # Update stable GitOps branch and create/reuse promotion PR
  # ================================================================
  Create-Pull-Request-Job:
    name: Create or Update QA Promotion PR
    runs-on: ${{ inputs.runner }}

    needs:
      - Promote-Check-Job
      - Promote-Dev-Image-Qa-Job

    if: |
      always() &&
      needs.Promote-Check-Job.result == 'success' &&
      needs.Promote-Check-Job.outputs.qa-already-current != 'true' &&
      (
        needs.Promote-Dev-Image-Qa-Job.result == 'success' ||
        needs.Promote-Dev-Image-Qa-Job.result == 'skipped'
      )

    steps:

      # ============================================================
      # 01. Checkout GitOps Repository
      # ============================================================
      - name: Checkout GitOps Repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.gitops-owner }}/${{ inputs.gitops-repo }}
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: ${{ env.GITOPS_DIR }}
          fetch-depth: 0


      # ============================================================
      # 02. Install yq
      # ============================================================
      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Installing yq $YQ_VERSION"
          echo "=================================================="

          wget -qO /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"

          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

          yq --version


      # ============================================================
      # 03. Determine stable promotion branch
      # ============================================================
      - name: Determine promotion branch
        id: branch-info
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Determining stable promotion branch"
          echo "=================================================="

          BRANCH="promote/${SERVICE}-dev-to-qa"

          echo "Service:"
          echo "$SERVICE"

          echo ""
          echo "Stable promotion branch:"
          echo "$BRANCH"

          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 04. Check whether an open QA promotion PR already exists
      # ============================================================
      - name: Check for existing QA promotion PR
        id: existing-pr
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Checking for existing QA promotion PR"
          echo "=================================================="

          EXISTING_PR_URL="$(
            gh pr list \
              --repo "${GITOPS_OWNER}/${GITOPS_REPO}" \
              --head "$BRANCH" \
              --base main \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [[ -n "$EXISTING_PR_URL" ]]; then

            echo ""
            echo "Existing open QA promotion PR found:"
            echo "$EXISTING_PR_URL"

            echo "existing=true" >> "$GITHUB_OUTPUT"
            echo "url=$EXISTING_PR_URL" >> "$GITHUB_OUTPUT"

          else

            echo ""
            echo "No open QA promotion PR found."

            echo "existing=false" >> "$GITHUB_OUTPUT"

          fi


      # ============================================================
      # 05. Prepare stable promotion branch
      #
      # Case A:
      #   Existing OPEN PR
      #   → checkout existing branch
      #
      # Case B:
      #   No OPEN PR but branch exists
      #   → remove stale branch and recreate from main
      #
      # Case C:
      #   No OPEN PR and no branch
      #   → create new branch from main
      # ============================================================
      - name: Prepare stable promotion branch
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        env:
          EXISTING_PR: ${{ steps.existing-pr.outputs.existing }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Preparing stable promotion branch"
          echo "=================================================="

          git fetch origin main

          # --------------------------------------------------------
          # Existing OPEN PR
          # --------------------------------------------------------
          if [[ "$EXISTING_PR" == "true" ]]; then

            echo "An open promotion PR already exists."
            echo "Reusing the existing branch:"
            echo "$BRANCH"

            git fetch origin main

            git checkout -B "$BRANCH" "origin/main"

          else

            # ------------------------------------------------------
            # No open PR.
            #
            # Check whether an old branch remains on the remote.
            # ------------------------------------------------------
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then

              echo "A stale promotion branch exists without an open PR."
              echo "Removing stale branch:"
              echo "$BRANCH"

              git push origin --delete "$BRANCH"

            fi

            echo ""
            echo "Creating fresh promotion branch from origin/main:"
            echo "$BRANCH"

            git checkout -b "$BRANCH" "origin/main"

          fi

          echo ""
          echo "Current branch:"
          git branch --show-current

          echo ""
          echo "Current commit:"
          git rev-parse --short HEAD


      # ============================================================
      # 06. Update QA image digest
      # ============================================================
      - name: Update QA image digest
        id: update-qa-digest
        working-directory: ${{ env.GITOPS_DIR }}
        env:
          DEV_IMAGE_DIGEST: ${{ needs.Promote-Check-Job.outputs.matched-file-digest-with-dev-ecr }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Updating QA image digest"
          echo "=================================================="

          if [[ ! -f "$QA_VALUES_FILE" ]]; then
            echo "::error::QA values file not found: $QA_VALUES_FILE"
            exit 1
          fi

          echo "QA values file:"
          echo "$QA_VALUES_FILE"

          CURRENT_QA_DIGEST="$(yq -r '.image.digest // ""' "$QA_VALUES_FILE")"

          echo ""
          echo "Current QA image digest:"
          if [[ -n "$CURRENT_QA_DIGEST" ]]; then
            echo "$CURRENT_QA_DIGEST"
          else
            echo "<empty>"
          fi

          echo ""
          echo "New DEV image digest:"
          echo "$DEV_IMAGE_DIGEST"

          # --------------------------------------------------------
          # Already current
          # --------------------------------------------------------
          if [[ "$CURRENT_QA_DIGEST" == "$DEV_IMAGE_DIGEST" ]]; then

            echo ""
            echo "QA already contains the requested digest."
            echo "No file update is required."

            exit 0

          fi

          # --------------------------------------------------------
          # Update QA digest
          # --------------------------------------------------------
          yq -i \
            '.image.digest = strenv(DEV_IMAGE_DIGEST)' \
            "$QA_VALUES_FILE"

          echo ""
          echo "Updated QA image digest:"
          yq -r '.image.digest' "$QA_VALUES_FILE"


      # ============================================================
      # 07. Show Git diff
      # ============================================================
      - name: Check Git diff
        id: git-diff
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Checking Git diff"
          echo "=================================================="

          git status --short

          echo ""
          echo "Diff:"
          echo "--------------------------------------------------"

          git diff -- "$QA_VALUES_FILE"

          echo "--------------------------------------------------"

          if git diff --quiet -- "$QA_VALUES_FILE"; then

            echo ""
            echo "No QA values change is required."

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo ""
            echo "QA values changed."

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # ============================================================
      # 08. Commit QA values update
      # ============================================================
      - name: Commit QA values update
        if: steps.git-diff.outputs.changed == 'true'
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        env:
          DEV_IMAGE_DIGEST: ${{ needs.Promote-Check-Job.outputs.matched-file-digest-with-dev-ecr }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Committing QA promotion"
          echo "=================================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$QA_VALUES_FILE"

          git commit \
            -m "chore: promote(${SERVICE}): DEV to QA ${DEV_IMAGE_DIGEST}"

          echo ""
          echo "Commit created:"
          git log -1 --oneline


      # ============================================================
      # 09. Push stable promotion branch
      # ============================================================
      - name: Push promotion branch
        if: steps.git-diff.outputs.changed == 'true'
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Pushing stable promotion branch"
          echo "=================================================="

          # git push --set-upstream origin "$BRANCH"
            
          git push --force-with-lease origin "$BRANCH"

          echo ""
          echo "Promotion branch pushed:"
          echo "$BRANCH"


      # ============================================================
      # 10. Create Pull Request if one does not already exist
      # ============================================================
      - name: Create Pull Request
        if: |
          steps.existing-pr.outputs.existing != 'true' &&
          steps.git-diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}

          DEV_IMAGE_DIGEST: ${{ needs.Promote-Check-Job.outputs.matched-file-digest-with-dev-ecr }}
          DEV_IMAGE_TAG: ${{ needs.Promote-Check-Job.outputs.dev-image-tag }}

          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Creating new QA promotion PR"
          echo "=================================================="

          PR_TITLE="promote(${SERVICE}): DEV → QA"

          PR_BODY="$(cat <<EOF
          ## QA Image Promotion

          Service: \`${SERVICE}\`

          Actor: \`${ACTOR}\`

          Source workflow ref: \`${REF_NAME}\`

          Promotion branch: \`${BRANCH}\`

          DEV repository: \`${DEV_ECR_REPO}\`

          QA repository: \`${QA_ECR_REPO}\`

          Image tag: \`${DEV_IMAGE_TAG}\`

          Image digest: \`${DEV_IMAGE_DIGEST}\`

          Workflow run:
          ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}

          ## Promotion

          **DEV → QA**

          ## Promotion Model

          This PR uses a stable service-specific promotion branch:

          \`${BRANCH}\`

          If a newer DEV image is promoted while this PR remains open,
          this same branch and PR will be updated with the newer immutable digest.

          ## Verification

          - No image rebuild performed.
          - DEV GitOps digest exists in DEV ECR.
          - Exact DEV digest copied to QA, or exact digest was already present in QA.
          - QA digest verified to match DEV digest.
          - QA GitOps values updated with the same immutable digest.

          ## QA Security

          After this PR is opened, required GitOps CI checks must pass:

          - Helm validation
          - Trivy configuration scan
          - Kubeconform
          - Kyverno CLI validation

          After merge, Argo CD will deploy the image to QA.
          EOF
          )"

          PR_URL="$(
            gh pr create \
              --repo "${GITOPS_OWNER}/${GITOPS_REPO}" \
              --base main \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          )"

          echo ""
          echo "QA promotion Pull Request created successfully:"
          echo "$PR_URL"


      # ============================================================
      # 11. Update Existing Pull Request
      # ============================================================
      #
      # When an open PR already exists:
      #
      #   - The stable branch has already been updated.
      #   - The existing PR must NOT be recreated.
      #   - Update the existing PR body with the latest digest.
      # ============================================================
      - name: Update Existing Pull Request
        if: |
          steps.existing-pr.outputs.existing == 'true' &&
          steps.git-diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}

          EXISTING_PR_URL: ${{ steps.existing-pr.outputs.url }}

          DEV_IMAGE_DIGEST: ${{ needs.Promote-Check-Job.outputs.matched-file-digest-with-dev-ecr }}
          DEV_IMAGE_TAG: ${{ needs.Promote-Check-Job.outputs.dev-image-tag }}

          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}

        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Updating existing QA promotion PR"
          echo "=================================================="

          echo "Existing PR:"
          echo "$EXISTING_PR_URL"

          echo ""
          echo "Latest DEV image tag:"
          echo "$DEV_IMAGE_TAG"

          echo ""
          echo "Latest DEV image digest:"
          echo "$DEV_IMAGE_DIGEST"

          PR_TITLE="promote(${SERVICE}): DEV → QA"

          PR_BODY="$(cat <<EOF
          ## QA Image Promotion

          Service: \`${SERVICE}\`

          Actor: \`${ACTOR}\`

          Source workflow ref: \`${REF_NAME}\`

          Promotion branch: \`${BRANCH}\`

          DEV repository: \`${DEV_ECR_REPO}\`

          QA repository: \`${QA_ECR_REPO}\`

          Image tag: \`${DEV_IMAGE_TAG}\`

          Image digest: \`${DEV_IMAGE_DIGEST}\`

          Latest promotion workflow run:
          ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}

          ## Promotion

          **DEV → QA**

          ## Promotion Model

          This PR uses a stable service-specific promotion branch:

          \`${BRANCH}\`

          If a newer DEV image is promoted while this PR remains open,
          the same branch and PR are updated with the newer immutable digest.

          ## Current Promoted Image

          The image currently represented by this PR is:

          - Image tag: \`${DEV_IMAGE_TAG}\`
          - Image digest: \`${DEV_IMAGE_DIGEST}\`

          No image rebuild is performed during promotion.

          ## Verification

          - DEV GitOps digest exists in DEV ECR.
          - Exact DEV digest copied to QA, or exact digest was already present in QA.
          - QA digest verified to match DEV digest.
          - QA GitOps values updated with the same immutable digest.
          - No image rebuild performed.

          ## QA Security

          After this PR is opened or updated, required GitOps CI checks must pass:

          - Helm validation
          - Trivy configuration scan
          - Kubeconform
          - Kyverno CLI validation

          After merge, Argo CD will deploy the image to QA.
          EOF
          )"

          echo ""
          echo "Updating PR title and body..."

          gh pr edit "$EXISTING_PR_URL" \
            --title "$PR_TITLE" \
            --body "$PR_BODY"

          echo ""
          echo "=================================================="
          echo "Existing QA promotion PR updated successfully"
          echo "=================================================="

          echo "PR:"
          echo "$EXISTING_PR_URL"

          echo ""
          echo "Latest image digest:"
          echo "$DEV_IMAGE_DIGEST"
