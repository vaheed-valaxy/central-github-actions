name: Reusable - Gitleaks

on:
  workflow_call:
    inputs:
      service-name:
        description: "Service Name"
        required: true
        type: string

      runner:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest

jobs:
  Gitleaks-Job:
    name: Gitleaks Scan
    runs-on: ${{ inputs.runner }}

    permissions:
      contents: read
      # pull-requests: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Official Image)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo \
            --report-format sarif \
            --report-path /repo/gitleaks-${{ inputs.service-name }}.sarif \
            --redact \
            --exit-code 0

      - name: Upload SARIF
        if: ${{ always() && hashFiles(format('gitleaks-{0}.sarif', inputs.service-name)) != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks-${{ inputs.service-name }}.sarif
          category: gitleaks-${{ inputs.service-name }}
          
