name: Reusable Promote QA to PROD

on:
  workflow_call:
    inputs:

      service-name:
        description: "Service to promote"
        required: true
        type: string

      qa-values-file:
        description: "QA Helm values file"
        required: true
        type: string

      prod-values-file:
        description: "PROD Helm values file"
        required: true
        type: string

      runner:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest

      gitops-repo:
        description: "GitOps repository name"
        required: true
        type: string

      gitops-owner:
        description: "GitOps repository owner"
        required: true
        type: string

      qa-ecr-repo:
        description: "QA ECR repository"
        required: true
        type: string

      prod-ecr-repo:
        description: "PROD ECR repository"
        required: true
        type: string

      aws-region:
        description: "AWS region"
        required: true
        type: string

      aws-ecr-prod-promotion-role-arn:
        description: "AWS IAM role ARN used for QA to PROD ECR promotion and PROD security metadata"
        required: true
        type: string

      cosign-certificate-identity-regexp:
        description: "Expected Cosign certificate identity regexp"
        required: true
        type: string

      cosign-sbom-attestation-certificate-identity-regexp:
        description: "Expected Sigstore certificate identity regexp"
        required: true
        type: string

      cosign-oidc-issuer:
        description: "Expected Cosign OIDC issuer"
        required: false
        type: string
        default: https://token.actions.githubusercontent.com

    secrets:
      GITOPS_TOKEN:
        description: "Token used to checkout, push, and create PRs in the GitOps repository"
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:

  SERVICE: ${{ inputs.service-name }}

  GITOPS_OWNER: ${{ inputs.gitops-owner }}
  GITOPS_REPO: ${{ inputs.gitops-repo }}
  GITOPS_DIR: "_gitops"

  QA_ECR_REPO: ${{ inputs.qa-ecr-repo }}
  PROD_ECR_REPO: ${{ inputs.prod-ecr-repo }}

  AWS_REGION: ${{ inputs.aws-region }}
  AWS_ECR_PROD_PROMOTION_ROLE_ARN: ${{ inputs.aws-ecr-prod-promotion-role-arn }}

  COSIGN_CERTIFICATE_IDENTITY_REGEXP: ${{ inputs.cosign-certificate-identity-regexp }}
  COSIGN_OIDC_ISSUER: ${{ inputs.cosign-oidc-issuer }}

  CRANE_VERSION: v0.21.7
  YQ_VERSION: "v4.47.1"

  QA_VALUES_FILE: ${{ inputs.qa-values-file }}
  PROD_VALUES_FILE: ${{ inputs.prod-values-file }}

concurrency:
  group: promote-qa-to-prod-${{ inputs.gitops-repo }}-${{ inputs.service-name }}
  cancel-in-progress: false

jobs:

  # ================================================================
  # JOB 1
  #
  # Check everything required before image promotion/security steps.
  #
  # IMPORTANT:
  # prod-already-current means ONLY:
  #
  #   QA GitOps digest == PROD GitOps digest
  #
  # It does NOT mean that PROD signing/SBOM security metadata exists.
  #
  # Therefore ECR/security checks still run when the GitOps digest
  # is already current.
  # ================================================================
  Promote-Check-Job:
    name: Promotion Prerequisites Check
    runs-on: ${{ inputs.runner }}

    outputs:
      account-id: ${{ steps.aws-account.outputs.account-id }}
      qa-image-tag: ${{ steps.image-info.outputs.qa-image-tag }}
      matched-file-digest-with-qa-ecr: ${{ steps.check-file-digest-with-qa-ecr.outputs.matched-file-digest-with-qa-ecr }}
      prod-image-already-exists: ${{ steps.prod-ecr-check.outputs.prod-image-already-exists }}
      prod-already-current: ${{ steps.compare-digests.outputs.prod-already-current }}
      prod-image-with-digest: ${{ steps.prod-image-reference.outputs.prod-image-with-digest }}

    steps:

      # ============================================================
      # 01. Checkout GitOps Repository
      # ============================================================
      - name: Checkout GitOps Repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.gitops-owner }}/${{ inputs.gitops-repo }}
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: ${{ env.GITOPS_DIR }}
          fetch-depth: 0

      # ============================================================
      # 02. Install yq
      # ============================================================
      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Installing yq $YQ_VERSION"
          echo "=================================================="

          wget -qO /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"

          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

          yq --version

      # ============================================================
      # 03. Ensure QA values file exists
      # ============================================================
      - name: Ensure QA values file exists
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$QA_VALUES_FILE" ]]; then
            echo "::error::QA values file not found: $QA_VALUES_FILE"
            echo "::error::Cannot determine QA image digest."
            exit 1
          fi

          echo "QA values file found:"
          echo "$QA_VALUES_FILE"

      # ============================================================
      # 04. Ensure PROD values file exists
      # ============================================================
      - name: Ensure PROD values file exists
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$PROD_VALUES_FILE" ]]; then
            echo "::error::PROD values file not found: $PROD_VALUES_FILE"
            echo "::error::Create this file in the GitOps repository."
            exit 1
          fi

          echo "PROD values file found:"
          echo "$PROD_VALUES_FILE"

      # ============================================================
      # 05. Read QA Image DIGEST
      # ============================================================
      - name: Read image DIGEST from QA
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          QA_FILE_DIGEST="$(yq -r '.image.digest // ""' "$QA_VALUES_FILE")"

          if [[ -z "$QA_FILE_DIGEST" || "$QA_FILE_DIGEST" == "null" ]]; then
            echo "::error::Could not read .image.digest from $QA_VALUES_FILE"
            exit 1
          fi

          if [[ ! "$QA_FILE_DIGEST" =~ ^sha256:[a-fA-F0-9]{64}$ ]]; then
            echo "::error::Invalid QA image digest."
            echo "Received: $QA_FILE_DIGEST"
            exit 1
          fi

          echo "=================================================="
          echo "QA image information"
          echo "=================================================="
          echo "Service: $SERVICE"
          echo "QA image digest: $QA_FILE_DIGEST"

          echo "QA_FILE_DIGEST=$QA_FILE_DIGEST" >> "$GITHUB_ENV"

      # ============================================================
      # 06. Read PROD Image DIGEST
      # ============================================================
      - name: Read image DIGEST from PROD
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          PROD_FILE_DIGEST="$(yq -r '.image.digest // ""' "$PROD_VALUES_FILE")"

          if [[ -z "$PROD_FILE_DIGEST" || "$PROD_FILE_DIGEST" == "null" ]]; then

            echo "=================================================="
            echo "PROD image information"
            echo "=================================================="
            echo "No PROD image digest found."
            echo "This appears to be the first PROD promotion."
            echo "Continuing..."

            PROD_FILE_DIGEST=""

          else

            if [[ ! "$PROD_FILE_DIGEST" =~ ^sha256:[a-fA-F0-9]{64}$ ]]; then
              echo "::error::Invalid PROD image digest."
              echo "Received: $PROD_FILE_DIGEST"
              exit 1
            fi

            echo "=================================================="
            echo "PROD image information"
            echo "=================================================="
            echo "Service: $SERVICE"
            echo "PROD image digest: $PROD_FILE_DIGEST"

          fi

          echo "PROD_FILE_DIGEST=$PROD_FILE_DIGEST" >> "$GITHUB_ENV"

      # ============================================================
      # 07. Compare QA and PROD Image DIGEST
      #
      # IMPORTANT:
      # This only determines whether GitOps needs a digest update.
      #
      # It does NOT skip ECR/signature/SBOM checks.
      # ============================================================
      - name: Compare QA and PROD image DIGEST
        id: compare-digests
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Comparing QA and PROD image digests"
          echo "=================================================="

          echo "QA digest:"
          echo "$QA_FILE_DIGEST"

          echo ""
          echo "PROD digest:"
          if [[ -n "$PROD_FILE_DIGEST" ]]; then
            echo "$PROD_FILE_DIGEST"
          else
            echo "<empty>"
          fi

          # --------------------------------------------------------
          # First PROD promotion
          # --------------------------------------------------------
          if [[ -z "$PROD_FILE_DIGEST" ]]; then

            echo ""
            echo "PROD digest is empty."
            echo "This is the first PROD promotion."

            echo "prod-already-current=false" >> "$GITHUB_OUTPUT"
            exit 0

          fi

          # --------------------------------------------------------
          # QA and PROD GitOps already contain same image
          # --------------------------------------------------------
          if [[ "$QA_FILE_DIGEST" == "$PROD_FILE_DIGEST" ]]; then

            echo ""
            echo "QA and PROD GitOps already contain the exact same digest."
            echo "No GitOps digest update is required."
            echo ""
            echo "IMPORTANT:"
            echo "PROD ECR/signature/SBOM checks will still run."

            echo "prod-already-current=true" >> "$GITHUB_OUTPUT"
            exit 0

          fi

          # --------------------------------------------------------
          # QA contains a newer/different digest
          # --------------------------------------------------------
          echo ""
          echo "QA and PROD contain different image digests."
          echo "PROD promotion is required."

          echo "prod-already-current=false" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 08. Configure AWS using GitHub OIDC
      #
      # ALWAYS RUN.
      #
      # We must be able to check PROD ECR even if GitOps already
      # contains the same digest.
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ECR_PROD_PROMOTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================================
      # 09. Get AWS Account ID
      # ============================================================
      - name: Get AWS account ID
        id: aws-account
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          if [[ -z "$ACCOUNT_ID" || "$ACCOUNT_ID" == "None" ]]; then
            echo "::error::Unable to determine AWS account ID."
            exit 1
          fi

          echo "AWS Account ID: $ACCOUNT_ID"

          echo "account-id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 10. Verify QA GitOps digest exists in QA ECR
      #
      # ALWAYS RUN.
      # ============================================================
      - name: Verify QA GitOps digest exists in QA ECR
        id: check-file-digest-with-qa-ecr
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Checking QA ECR image"
          echo "=================================================="

          if aws ecr describe-images \
               --repository-name "$QA_ECR_REPO" \
               --image-ids imageDigest="$QA_FILE_DIGEST" \
               --region "$AWS_REGION" \
               >/dev/null 2>&1; then

            echo "QA image exists in ECR."
            echo "Repository: $QA_ECR_REPO"
            echo "Digest: $QA_FILE_DIGEST"

            echo "matched-file-digest-with-qa-ecr=$QA_FILE_DIGEST" >> "$GITHUB_OUTPUT"

          else

            echo "::error::QA GitOps digest does not exist in QA ECR."
            echo "Repository: $QA_ECR_REPO"
            echo "Digest: $QA_FILE_DIGEST"
            echo "::error::Promotion cancelled."

            exit 1

          fi

      # ============================================================
      # 11. Find original SHA tag from QA
      #
      # ALWAYS RUN.
      # ============================================================
      - name: Find QA image tag
        id: image-info
        shell: bash
        run: |
          set -euo pipefail

          MATCHED_FILE_DIGEST_WITH_QA_ECR="${{ steps.check-file-digest-with-qa-ecr.outputs.matched-file-digest-with-qa-ecr }}"

          TAGS="$(aws ecr describe-images \
            --repository-name "$QA_ECR_REPO" \
            --image-ids imageDigest="$MATCHED_FILE_DIGEST_WITH_QA_ECR" \
            --query 'imageDetails[0].imageTags' \
            --output text \
            --region "$AWS_REGION")"

          echo "QA tags:"
          echo "$TAGS"

          QA_IMAGE_TAG="$(
            echo "$TAGS" |
            tr '\t' '\n' |
            grep '^sha-' |
            head -n 1 ||
            true
          )"

          if [[ -z "$QA_IMAGE_TAG" ]]; then
            echo "::error::No sha-* tag found for QA digest."
            echo "Digest: $MATCHED_FILE_DIGEST_WITH_QA_ECR"
            exit 1
          fi

          echo ""
          echo "Service:"
          echo "$SERVICE"

          echo ""
          echo "Selected QA image tag:"
          echo "$QA_IMAGE_TAG"

          echo ""
          echo "Selected QA image digest:"
          echo "$MATCHED_FILE_DIGEST_WITH_QA_ECR"

          echo "qa-image-tag=$QA_IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 12. Check whether exact image already exists in PROD ECR
      #
      # ALWAYS RUN.
      #
      # This is critical for retry/idempotency.
      # ============================================================
      - name: Check PROD image
        id: prod-ecr-check
        shell: bash
        env:
          QA_IMAGE_TAG: ${{ steps.image-info.outputs.qa-image-tag }}
          MATCHED_FILE_DIGEST_WITH_QA_ECR: ${{ steps.check-file-digest-with-qa-ecr.outputs.matched-file-digest-with-qa-ecr }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Checking PROD ECR image"
          echo "=================================================="

          set +e

          PROD_LOOKUP="$(
            aws ecr describe-images \
              --repository-name "$PROD_ECR_REPO" \
              --image-ids imageTag="$QA_IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text \
              --region "$AWS_REGION" \
              2>&1
          )"

          PROD_LOOKUP_EXIT_CODE=$?

          set -e

          # --------------------------------------------------------
          # PROD tag exists
          # --------------------------------------------------------
          if [[ "$PROD_LOOKUP_EXIT_CODE" -eq 0 ]]; then

            EXISTING_PROD_DIGEST="$PROD_LOOKUP"

            echo "PROD tag already exists."
            echo "PROD repository: $PROD_ECR_REPO"
            echo "PROD tag:        $QA_IMAGE_TAG"
            echo "PROD digest:     $EXISTING_PROD_DIGEST"
            echo "QA digest:       $MATCHED_FILE_DIGEST_WITH_QA_ECR"

            if [[ "$EXISTING_PROD_DIGEST" != "$MATCHED_FILE_DIGEST_WITH_QA_ECR" ]]; then
              echo "::error::PROD tag exists but points to a different digest."
              echo "::error::This prevents accidental tag reuse."
              echo "::error::Expected: $MATCHED_FILE_DIGEST_WITH_QA_ECR"
              echo "::error::Found: $EXISTING_PROD_DIGEST"
              exit 1
            fi

            echo ""
            echo "Exact image already exists in PROD ECR."
            echo "Image copy can be skipped."
            echo "Security metadata verification will still run."

            echo "prod-image-already-exists=true" >> "$GITHUB_OUTPUT"
            exit 0

          fi

          # --------------------------------------------------------
          # PROD tag does not exist
          # --------------------------------------------------------
          if [[ "$PROD_LOOKUP" == *"ImageNotFoundException"* ]]; then

            echo "PROD image tag does not exist yet."
            echo "Image promotion is required."

            echo "prod-image-already-exists=false" >> "$GITHUB_OUTPUT"
            exit 0

          fi

          # --------------------------------------------------------
          # Unexpected AWS error
          # --------------------------------------------------------
          echo "::error::Failed to check PROD ECR image."
          echo "$PROD_LOOKUP"

          exit 1

      # ============================================================
      # 13. Build exact immutable PROD image reference
      #
      # This reference is used by both Cosign and SBOM workflows.
      # ============================================================
      - name: Build exact PROD image reference
        id: prod-image-reference
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.aws-account.outputs.account-id }}
          MATCHED_FILE_DIGEST_WITH_QA_ECR: ${{ steps.check-file-digest-with-qa-ecr.outputs.matched-file-digest-with-qa-ecr }}
        run: |
          set -euo pipefail

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          PROD_IMAGE_WITH_DIGEST="${REGISTRY}/${PROD_ECR_REPO}@${MATCHED_FILE_DIGEST_WITH_QA_ECR}"

          echo "=================================================="
          echo "Exact PROD image reference"
          echo "=================================================="

          echo "$PROD_IMAGE_WITH_DIGEST"

          echo "prod-image-with-digest=$PROD_IMAGE_WITH_DIGEST" >> "$GITHUB_OUTPUT"


  # ================================================================
  # JOB 2
  #
  # Copy exact QA image digest to PROD.
  #
  # This job is skipped when the exact PROD image already exists.
  #
  # IMPORTANT:
  # It does NOT depend on prod-already-current.
  #
  # Even if GitOps already has the digest, we repair PROD ECR if
  # the exact image is missing.
  # ================================================================
  Promote-Qa-Image-Prod-Job:
    name: Promote QA Image to PROD
    runs-on: ${{ inputs.runner }}

    needs:
      - Promote-Check-Job

    if: >-
      needs.Promote-Check-Job.result == 'success' &&
      needs.Promote-Check-Job.outputs.prod-image-already-exists != 'true'

    outputs:
      is-qa-prod-ecr-digest-matched: ${{ steps.check-qa-prod-ecr-match.outputs.is-qa-prod-ecr-digest-matched }}
      matched-qa-prod-ecr-digest: ${{ steps.check-qa-prod-ecr-match.outputs.matched-qa-prod-ecr-digest }}

    steps:

      # ============================================================
      # 01. Configure AWS using GitHub OIDC
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ECR_PROD_PROMOTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================================
      # 02. Install Crane
      # ============================================================
      - name: Install Crane
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Installing Crane $CRANE_VERSION"
          echo "=================================================="

          curl -fsSL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            -o /tmp/go-containerregistry.tar.gz

          tar -xzf \
            /tmp/go-containerregistry.tar.gz \
            -C /tmp

          sudo mv /tmp/crane /usr/local/bin/crane

          crane version

      # ============================================================
      # 03. Login Crane to ECR
      # ============================================================
      - name: Login Crane to ECR
        shell: bash
        env:
          ACCOUNT_ID: ${{ needs.Promote-Check-Job.outputs.account-id }}
        run: |
          set -euo pipefail

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "Logging into:"
          echo "$REGISTRY"

          aws ecr get-login-password \
            --region "$AWS_REGION" |
            crane auth login "$REGISTRY" \
              --username AWS \
              --password-stdin

      # ============================================================
      # 04. Promote exact digest QA → PROD
      # ============================================================
      - name: Promote exact image digest
        shell: bash
        env:
          ACCOUNT_ID: ${{ needs.Promote-Check-Job.outputs.account-id }}
          QA_IMAGE_TAG: ${{ needs.Promote-Check-Job.outputs.qa-image-tag }}
          MATCHED_FILE_DIGEST_WITH_QA_ECR: ${{ needs.Promote-Check-Job.outputs.matched-file-digest-with-qa-ecr }}
        run: |
          set -euo pipefail

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          SOURCE="${REGISTRY}/${QA_ECR_REPO}@${MATCHED_FILE_DIGEST_WITH_QA_ECR}"
          TARGET="${REGISTRY}/${PROD_ECR_REPO}:${QA_IMAGE_TAG}"

          echo "=================================================="
          echo "Promoting exact image"
          echo "=================================================="

          echo "SOURCE:"
          echo "$SOURCE"

          echo ""
          echo "TARGET:"
          echo "$TARGET"

          echo ""
          echo "Copying exact QA digest with exact tag to PROD..."

          crane copy "$SOURCE" "$TARGET"

          echo ""
          echo "Image promotion completed successfully from QA to PROD."

      # ============================================================
      # 05. Verify PROD digest matches QA digest
      # ============================================================
      - name: Verify PROD digest matches QA digest in ECR
        id: check-qa-prod-ecr-match
        shell: bash
        env:
          QA_IMAGE_TAG: ${{ needs.Promote-Check-Job.outputs.qa-image-tag }}
          MATCHED_FILE_DIGEST_WITH_QA_ECR: ${{ needs.Promote-Check-Job.outputs.matched-file-digest-with-qa-ecr }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Verifying QA and PROD digests"
          echo "=================================================="

          PROD_DIGEST="$(
            aws ecr describe-images \
              --repository-name "$PROD_ECR_REPO" \
              --image-ids imageTag="$QA_IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text \
              --region "$AWS_REGION"
          )"

          echo ""
          echo "QA digest:"
          echo "$MATCHED_FILE_DIGEST_WITH_QA_ECR"

          echo ""
          echo "PROD digest:"
          echo "$PROD_DIGEST"

          if [[ "$PROD_DIGEST" != "$MATCHED_FILE_DIGEST_WITH_QA_ECR" ]]; then

            echo ""
            echo "::error::Digest mismatch between QA and PROD."
            exit 1

          fi

          echo ""
          echo "SUCCESS"
          echo "QA and PROD contain the exact same image digest."

          echo "is-qa-prod-ecr-digest-matched=true" >> "$GITHUB_OUTPUT"
          echo "matched-qa-prod-ecr-digest=$MATCHED_FILE_DIGEST_WITH_QA_ECR" >> "$GITHUB_OUTPUT"


  # ================================================================
  # JOB 3
  #
  # Sign exact PROD image digest.
  #
  # IMPORTANT:
  # This runs whether:
  #
  #   Job 2 copied the image
  #
  # OR
  #
  #   Job 2 was skipped because the exact image already exists.
  #
  # The reusable signing workflow performs:
  #
  #   verify existing signature
  #          ↓
  #   exists → SKIP
  #          ↓
  #   missing → SIGN
  #
  # This makes the operation retry-safe.
  # ================================================================
  Sign-Prod-Image-Job:
    name: Sign PROD Image
    needs:
      - Promote-Check-Job
      - Promote-Qa-Image-Prod-Job

    if: >-
      always() &&
      needs.Promote-Check-Job.result == 'success' &&
      (
        needs.Promote-Qa-Image-Prod-Job.result == 'success' ||
        needs.Promote-Qa-Image-Prod-Job.result == 'skipped'
      )

    permissions:
      contents: read
      id-token: write

    uses: vaheed-valaxy/central-github-actions/.github/workflows/reusable-image-sign.yml@main

    with:
      service-name: ${{ inputs.service-name }}

      runner: ${{ inputs.runner }}

      image-with-digest: ${{ needs.Promote-Check-Job.outputs.prod-image-with-digest }}

      aws-region: ${{ inputs.aws-region }}

      aws-ecr-role-arn: ${{ inputs.aws-ecr-prod-promotion-role-arn }}

      cosign-certificate-identity-regexp: ${{ inputs.cosign-certificate-identity-regexp }}

      cosign-oidc-issuer: ${{ inputs.cosign-oidc-issuer }}


  # ================================================================
  # JOB 4
  #
  # Generate CycloneDX SBOM and attest exact PROD image digest.
  #
  # This runs only after signing succeeds.
  #
  # The reusable SBOM workflow performs:
  #
  #   verify existing CycloneDX attestation
  #              ↓
  #       exists → SKIP
  #              ↓
  #       missing → generate SBOM → attest
  #
  # This makes the operation retry-safe.
  # ================================================================
  SBOM-Prod-Image-Job:
    name: Generate and Attest PROD SBOM

    needs:
      - Promote-Check-Job
      - Sign-Prod-Image-Job

    if: >-
      needs.Sign-Prod-Image-Job.result == 'success'

    permissions:
      contents: read
      id-token: write

    uses: vaheed-valaxy/central-github-actions/.github/workflows/reusable-sbom-attestation.yml@main

    with:
      service-name: ${{ inputs.service-name }}

      runner: ${{ inputs.runner }}

      image-with-digest: ${{ needs.Promote-Check-Job.outputs.prod-image-with-digest }}

      aws-region: ${{ inputs.aws-region }}

      aws-ecr-role-arn: ${{ inputs.aws-ecr-prod-promotion-role-arn }}

      cosign-certificate-identity-regexp: ${{ inputs.cosign-certificate-identity-regexp }}

      cosign-sbom-attestation-certificate-identity-regexp: ${{ inputs.cosign-sbom-attestation-certificate-identity-regexp }}

      cosign-oidc-issuer: ${{ inputs.cosign-oidc-issuer }}


  # ================================================================
  # JOB 5
  #
  # Update stable GitOps branch and create/reuse promotion PR.
  #
  # IMPORTANT:
  # This job ONLY runs when:
  #
  #   1. Image is available in PROD.
  #   2. Signature verification/signing succeeded.
  #   3. SBOM verification/attestation succeeded.
  #   4. PROD GitOps digest is different from QA digest.
  #
  # If PROD GitOps already contains the same digest, there is no
  # GitOps change/PR required.
  # ================================================================
  Create-Pull-Request-Job:
    name: Create or Update PROD Promotion PR
    runs-on: ${{ inputs.runner }}

    needs:
      - Promote-Check-Job
      - Promote-Qa-Image-Prod-Job
      - Sign-Prod-Image-Job
      - SBOM-Prod-Image-Job

    if: >-
      always() &&
      needs.Promote-Check-Job.result == 'success' &&
      (
        needs.Promote-Qa-Image-Prod-Job.result == 'success' ||
        needs.Promote-Qa-Image-Prod-Job.result == 'skipped'
      ) &&
      needs.Sign-Prod-Image-Job.result == 'success' &&
      needs.SBOM-Prod-Image-Job.result == 'success' &&
      needs.Promote-Check-Job.outputs.prod-already-current != 'true'

    steps:

      # ============================================================
      # 01. Checkout GitOps Repository
      # ============================================================
      - name: Checkout GitOps Repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.gitops-owner }}/${{ inputs.gitops-repo }}
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: ${{ env.GITOPS_DIR }}
          fetch-depth: 0

      # ============================================================
      # 02. Install yq
      # ============================================================
      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Installing yq $YQ_VERSION"
          echo "=================================================="

          wget -qO /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"

          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

          yq --version

      # ============================================================
      # 03. Determine stable promotion branch
      # ============================================================
      - name: Determine promotion branch
        id: branch-info
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Determining stable promotion branch"
          echo "=================================================="

          BRANCH="promote/${SERVICE}-qa-to-prod"

          echo "Service:"
          echo "$SERVICE"

          echo ""
          echo "Stable promotion branch:"
          echo "$BRANCH"

          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 04. Check whether an open PROD promotion PR already exists
      # ============================================================
      - name: Check for existing PROD promotion PR
        id: existing-pr
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Checking for existing PROD promotion PR"
          echo "=================================================="

          EXISTING_PR_URL="$(
            gh pr list \
              --repo "${GITOPS_OWNER}/${GITOPS_REPO}" \
              --head "$BRANCH" \
              --base main \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [[ -n "$EXISTING_PR_URL" ]]; then

            echo ""
            echo "Existing open PROD promotion PR found:"
            echo "$EXISTING_PR_URL"

            echo "existing=true" >> "$GITHUB_OUTPUT"
            echo "url=$EXISTING_PR_URL" >> "$GITHUB_OUTPUT"

          else

            echo ""
            echo "No open PROD promotion PR found."

            echo "existing=false" >> "$GITHUB_OUTPUT"

          fi

      # ============================================================
      # 05. Prepare stable promotion branch
      # ============================================================
      - name: Prepare stable promotion branch
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        env:
          EXISTING_PR: ${{ steps.existing-pr.outputs.existing }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Preparing stable promotion branch"
          echo "=================================================="

          git fetch origin main

          # --------------------------------------------------------
          # Existing OPEN PR
          # --------------------------------------------------------
          if [[ "$EXISTING_PR" == "true" ]]; then

            echo "An open promotion PR already exists."
            echo "Reusing the existing branch:"
            echo "$BRANCH"

            git checkout -B "$BRANCH" "origin/main"

          else

            # ------------------------------------------------------
            # No open PR.
            #
            # Check whether an old branch remains on the remote.
            # ------------------------------------------------------
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then

              echo "A stale promotion branch exists without an open PR."
              echo "Removing stale branch:"
              echo "$BRANCH"

              git push origin --delete "$BRANCH"

            fi

            echo ""
            echo "Creating fresh promotion branch from origin/main:"
            echo "$BRANCH"

            git checkout -b "$BRANCH" "origin/main"

          fi

          echo ""
          echo "Current branch:"
          git branch --show-current

          echo ""
          echo "Current commit:"
          git rev-parse --short HEAD

      # ============================================================
      # 06. Update PROD image digest
      # ============================================================
      - name: Update PROD image digest
        id: update-prod-digest
        working-directory: ${{ env.GITOPS_DIR }}
        env:
          QA_IMAGE_DIGEST: ${{ needs.Promote-Check-Job.outputs.matched-file-digest-with-qa-ecr }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Updating PROD image digest"
          echo "=================================================="

          if [[ ! -f "$PROD_VALUES_FILE" ]]; then
            echo "::error::PROD values file not found: $PROD_VALUES_FILE"
            exit 1
          fi

          echo "PROD values file:"
          echo "$PROD_VALUES_FILE"

          CURRENT_PROD_DIGEST="$(yq -r '.image.digest // ""' "$PROD_VALUES_FILE")"

          echo ""
          echo "Current PROD image digest:"
          if [[ -n "$CURRENT_PROD_DIGEST" ]]; then
            echo "$CURRENT_PROD_DIGEST"
          else
            echo "<empty>"
          fi

          echo ""
          echo "New QA image digest:"
          echo "$QA_IMAGE_DIGEST"

          # --------------------------------------------------------
          # Already current
          # --------------------------------------------------------
          if [[ "$CURRENT_PROD_DIGEST" == "$QA_IMAGE_DIGEST" ]]; then

            echo ""
            echo "PROD already contains the requested digest."
            echo "No file update is required."

            exit 0

          fi

          # --------------------------------------------------------
          # Update PROD digest
          # --------------------------------------------------------
          yq -i \
            '.image.digest = strenv(QA_IMAGE_DIGEST)' \
            "$PROD_VALUES_FILE"

          echo ""
          echo "Updated PROD image digest:"

          yq -r '.image.digest' "$PROD_VALUES_FILE"

      # ============================================================
      # 07. Show Git diff
      # ============================================================
      - name: Check Git diff
        id: git-diff
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Checking Git diff"
          echo "=================================================="

          git status --short

          echo ""
          echo "Diff:"
          echo "--------------------------------------------------"

          git diff -- "$PROD_VALUES_FILE"

          echo "--------------------------------------------------"

          if git diff --quiet -- "$PROD_VALUES_FILE"; then

            echo ""
            echo "No PROD values change is required."

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo ""
            echo "PROD values changed."

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi

      # ============================================================
      # 08. Commit PROD values update
      # ============================================================
      - name: Commit PROD values update
        if: steps.git-diff.outputs.changed == 'true'
        working-directory: ${{ env.GITOPS_DIR }}
        env:
          QA_IMAGE_DIGEST: ${{ needs.Promote-Check-Job.outputs.matched-file-digest-with-qa-ecr }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Committing PROD promotion"
          echo "=================================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$PROD_VALUES_FILE"

          git commit \
            -m "chore: promote(${SERVICE}): QA to PROD ${QA_IMAGE_DIGEST}"

          echo ""
          echo "Commit created:"
          git log -1 --oneline

      # ============================================================
      # 09. Push stable promotion branch
      # ============================================================
      - name: Push promotion branch
        if: steps.git-diff.outputs.changed == 'true'
        working-directory: ${{ env.GITOPS_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Pushing stable promotion branch"
          echo "=================================================="

          git push --force-with-lease origin "$BRANCH"

          echo ""
          echo "Promotion branch pushed:"
          echo "$BRANCH"

      # ============================================================
      # 10. Create Pull Request
      # ============================================================
      - name: Create Pull Request
        if: |
          steps.existing-pr.outputs.existing != 'true' &&
          steps.git-diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}

          QA_IMAGE_DIGEST: ${{ needs.Promote-Check-Job.outputs.matched-file-digest-with-qa-ecr }}
          QA_IMAGE_TAG: ${{ needs.Promote-Check-Job.outputs.qa-image-tag }}

          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Creating new QA promotion PR"
          echo "=================================================="

          PR_TITLE="promote(${SERVICE}): QA → PROD"

          PR_BODY="$(cat <<EOF
          ## PROD Image Promotion

          Service: \`${SERVICE}\`

          Actor: \`${ACTOR}\`

          Source workflow ref: \`${REF_NAME}\`

          Promotion branch: \`${BRANCH}\`

          QA repository: \`${QA_ECR_REPO}\`

          PROD repository: \`${PROD_ECR_REPO}\`

          Image tag: \`${QA_IMAGE_TAG}\`

          Image digest: \`${QA_IMAGE_DIGEST}\`

          Workflow run:
          ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}

          ## Promotion

          **QA → PROD**

          ## Promotion Model

          This PR uses a stable service-specific promotion branch:

          \`${BRANCH}\`

          If a newer QA image is promoted while this PR remains open,
          this same branch and PR will be updated with the newer immutable digest.

          ## Image Verification

          - No image rebuild performed.
          - QA GitOps digest exists in QA ECR.
          - Exact QA digest copied to PROD, or exact digest was already present in PROD.
          - PROD digest verified to match QA digest.
          - PROD GitOps values updated with the same immutable digest.

          ## PROD Security

          Before this PR is created or updated:

          - Exact PROD image digest was verified/signed with Cosign keyless signing.
          - CycloneDX SBOM attestation was verified/generated for the exact PROD image digest.
          - Existing valid security metadata is reused on workflow retries.

          ## GitOps Validation

          After this PR is opened or updated, required GitOps CI checks must pass:

          - Helm validation
          - Trivy configuration scan
          - Kubeconform
          - Kyverno CLI validation

          After merge, \`Manual Deployment\` to PROD using Argo CD.
          EOF
          )"

          PR_URL="$(
            gh pr create \
              --repo "${GITOPS_OWNER}/${GITOPS_REPO}" \
              --base main \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          )"

          echo ""
          echo "PROD promotion Pull Request created successfully:"
          echo "$PR_URL"

      # ============================================================
      # 11. Update Existing Pull Request
      # ============================================================
      - name: Update Existing Pull Request
        if: |
          steps.existing-pr.outputs.existing == 'true' &&
          steps.git-diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}

          EXISTING_PR_URL: ${{ steps.existing-pr.outputs.url }}

          QA_IMAGE_DIGEST: ${{ needs.Promote-Check-Job.outputs.matched-file-digest-with-qa-ecr }}
          QA_IMAGE_TAG: ${{ needs.Promote-Check-Job.outputs.qa-image-tag }}

          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}

        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Updating existing PROD promotion PR"
          echo "=================================================="

          echo "Existing PR:"
          echo "$EXISTING_PR_URL"

          echo ""
          echo "Latest QA image tag:"
          echo "$QA_IMAGE_TAG"

          echo ""
          echo "Latest QA image digest:"
          echo "$QA_IMAGE_DIGEST"

          PR_TITLE="promote(${SERVICE}): QA → PROD"

          PR_BODY="$(cat <<EOF
          ## PROD Image Promotion

          Service: \`${SERVICE}\`

          Actor: \`${ACTOR}\`

          Source workflow ref: \`${REF_NAME}\`

          Promotion branch: \`${BRANCH}\`

          QA repository: \`${QA_ECR_REPO}\`

          PROD repository: \`${PROD_ECR_REPO}\`

          Image tag: \`${QA_IMAGE_TAG}\`

          Image digest: \`${QA_IMAGE_DIGEST}\`

          Latest promotion workflow run:
          ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}

          ## Promotion

          **QA → PROD**

          ## Promotion Model

          This PR uses a stable service-specific promotion branch:

          \`${BRANCH}\`

          If a newer QA image is promoted while this PR remains open,
          the same branch and PR are updated with the newer immutable digest.

          ## Current Promoted Image

          The image currently represented by this PR is:

          - Image tag: \`${QA_IMAGE_TAG}\`
          - Image digest: \`${QA_IMAGE_DIGEST}\`

          No image rebuild is performed during promotion.

          ## Image Verification

          - QA GitOps digest exists in QA ECR.
          - Exact QA digest copied to PROD, or exact digest was already present in PROD.
          - PROD digest verified to match QA digest.
          - PROD GitOps values updated with the same immutable digest.
          - No image rebuild performed.

          ## PROD Security

          Before this PR was created or updated:

          - Exact PROD image digest was verified/signed with Cosign keyless signing.
          - CycloneDX SBOM attestation was verified/generated for the exact PROD image digest.
          - Existing valid security metadata is reused on workflow retries.

          ## GitOps Validation

          After this PR is opened or updated, required GitOps CI checks must pass:

          - Helm validation
          - Trivy configuration scan
          - Kubeconform
          - Kyverno CLI validation

          After merge, \`Manual Deployment\` to PROD using Argo CD.
          EOF
          )"

          echo ""
          echo "Updating PR title and body..."

          gh pr edit "$EXISTING_PR_URL" \
            --title "$PR_TITLE" \
            --body "$PR_BODY"

          echo ""
          echo "=================================================="
          echo "Existing PROD promotion PR updated successfully"
          echo "=================================================="

          echo "PR:"
          echo "$EXISTING_PR_URL"

          echo ""
          echo "Latest image digest:"
          echo "$QA_IMAGE_DIGEST"
