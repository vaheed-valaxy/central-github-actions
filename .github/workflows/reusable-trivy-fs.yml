name: Reusable - Trivy FS Scan

on:
  workflow_call:
    inputs:
      # ======================================================
      # General
      # ======================================================
      service-name:
        description: "Service Name"
        required: true
        type: string

      runner:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest


      # ======================================================
      # Trivy
      # ======================================================
      
      trivy-version:
        description: "Trivy version"
        required: false
        type: string
        default: v0.72.0
        
      trivy-fs-scan-path:
        description: "Path to scan"
        required: false
        type: string
        default: "."

      trivy-fs-skip-files:
        description: "Comma-separated files or glob patterns to skip"
        required: false
        type: string
        default: ""

jobs:

  Trivy-Fs-Scan-Job:
    name: Trivy FS Scan
    runs-on: ${{ inputs.runner }}

    permissions:
      contents: read
      security-events: write

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ======================================================
      # Verify Scan Path
      # ======================================================

      - name: Verify Scan Path
        run: |
          echo "# ---------------------------------------------- #"
          echo "Service  : ${{ inputs.service-name }}"
          echo "Scan path: ${{ inputs.trivy-fs-scan-path }}"
          echo "# ---------------------------------------------- #"

          if [ ! -d "${{ inputs.trivy-fs-scan-path }}" ]; then
            echo "ERROR: Scan path does not exist: ${{ inputs.trivy-fs-scan-path }}"
            exit 1
          fi
          echo " Scan path contents: "
          ls -la "${{ inputs.trivy-fs-scan-path }}"

      # ======================================================
      # Install Trivy
      # ======================================================

      - name: Setup Trivy
        # uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        uses: aquasecurity/setup-trivy@v0.2.6 
        with:
          version: ${{ inputs.trivy-version }}
          cache: true

      # ======================================================
      # Verify Trivy
      # ======================================================

      - name: Verify Trivy Installation
        run: |
          echo "Trivy version:"
          trivy --version
      

      # - name: Install Trivy
      #   shell: bash
      #   env:
      #     TRIVY_VERSION: ${{ inputs.trivy-version }}
      #   run: |
      #     set -euo pipefail

      #     VERSION="${TRIVY_VERSION#v}"
      #     ARCHIVE="trivy_${VERSION}_Linux-64bit.tar.gz"
      #     CHECKSUM_FILE="trivy_${VERSION}_checksums.txt"

      #     DOWNLOAD_URL="https://github.com/aquasecurity/trivy/releases/download/v${VERSION}"

      #     TEMP_DIR="$(mktemp -d)"
      #     INSTALL_DIR="${HOME}/.local/bin"

      #     trap 'rm -rf "${TEMP_DIR}"' EXIT

      #     mkdir -p "${INSTALL_DIR}"

      #     echo "Downloading Trivy ${TRIVY_VERSION}"

      #     curl --fail --location --silent --show-error \
      #       --retry 3 \
      #       --retry-delay 2 \
      #       -o "${TEMP_DIR}/${ARCHIVE}" \
      #       "${DOWNLOAD_URL}/${ARCHIVE}"

      #     echo "Downloading SHA256 checksums"

      #     curl --fail --location --silent --show-error \
      #       --retry 3 \
      #       --retry-delay 2 \
      #       -o "${TEMP_DIR}/${CHECKSUM_FILE}" \
      #       "${DOWNLOAD_URL}/${CHECKSUM_FILE}"

      #     echo "Verifying Trivy checksum"

      #     CHECKSUM_LINE="$(awk -v file="${ARCHIVE}" '$2 == file || $2 == "*" file {print; exit}' "${TEMP_DIR}/${CHECKSUM_FILE}")"

      #     if [ -z "${CHECKSUM_LINE}" ]; then
      #       echo "ERROR: Trivy archive checksum not found"
      #       exit 1
      #     fi

      #     printf '%s\n' "${CHECKSUM_LINE}" > "${TEMP_DIR}/checksum.txt"

      #     cd "${TEMP_DIR}"
      #     sha256sum --check checksum.txt

      #     echo "Extracting Trivy"

      #     tar -xzf "${ARCHIVE}"

      #     install -m 0755 trivy "${INSTALL_DIR}/trivy"

      #     echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"

      #     echo "Trivy installation completed"

      #     trivy --version

      # ======================================================
      # Trivy FS Scan → JSON
      # ======================================================

      - name: Trivy Filesystem Scan
        # continue-on-error: true      
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ inputs.trivy-version }} 
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: ${{ inputs.trivy-fs-scan-path}}
          format: json
          output: trivy-fs-${{ inputs.service-name }}.json 
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-files: ${{ inputs.trivy-fs-skip-files }}  # '**/README.md,**/LICENSE,**/docs/**'
          exit-code: 0

      # ======================================================
      # Verify JSON
      # ======================================================

      - name: Verify JSON File
        if: always()
        run: |
          echo "Checking JSON file..."

          if [ -f "trivy-fs-${{ inputs.service-name }}.json" ]; then
            echo "JSON file exists: trivy-fs-${{ inputs.service-name }}.json"
            ls -lh "trivy-fs-${{ inputs.service-name }}.json"
          else
            echo "ERROR: trivy-fs-${{ inputs.service-name }}.json JSON file was not generated"
            exit 1
          fi

      # ======================================================
      # Upload JSON Artifact
      # ======================================================

      - name: Upload Trivy FS JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report-${{ inputs.service-name }}
          path: trivy-fs-${{ inputs.service-name }}.json
          if-no-files-found: warn
          retention-days: 0

      # ======================================================
      # Convert JSON → SARIF
      # ======================================================

      - name: Convert Trivy JSON to SARIF
        if: always() && hashFiles(format('trivy-fs-{0}.json', inputs.service-name)) != ''
        run: |
          trivy convert \
            --format sarif \
            --output trivy-fs-${{ inputs.service-name }}.sarif \
            trivy-fs-${{ inputs.service-name }}.json

      # ======================================================
      # Verify SARIF
      # ======================================================

      - name: Verify SARIF File
        if: always() && hashFiles(format('trivy-fs-{0}.sarif', inputs.service-name)) != ''
        run: |
          echo "Checking SARIF file..."

          if [ -f "trivy-fs-${{ inputs.service-name }}.sarif" ]; then
            echo "SARIF file exists"
            ls -lh "trivy-fs-${{ inputs.service-name }}.sarif"
          else
            echo "ERROR: SARIF file was not generated"
            exit 1
          fi

      # ======================================================
      # Upload SARIF → GitHub Code Scanning
      # ======================================================

      - name: Upload Trivy FS SARIF
        if: ${{ always() && hashFiles(format('trivy-fs-{0}.sarif', inputs.service-name)) != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-${{ inputs.service-name }}.sarif
          category: trivy-fs-${{ inputs.service-name }}
