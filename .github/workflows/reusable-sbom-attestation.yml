name: Reusable - SBOM Attestation

on:
  workflow_call:
    inputs:

      service-name:
        description: "Service Name"
        required: true
        type: string

      runner:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest

      image-with-digest:
        description: "Complete PROD ECR image reference with digest"
        required: true
        type: string

      aws-region:
        description: "AWS Region"
        required: true
        type: string

      aws-ecr-role-arn:
        description: "AWS IAM role used to access PROD ECR"
        required: true
        type: string

      cosign-sbom-attestation-certificate-identity-regexp:
        description: "Expected Sigstore certificate identity regexp"
        required: true
        type: string

      cosign-oidc-issuer:
        description: "Expected OIDC issuer for keyless Cosign attestation"
        required: false
        type: string
        default: https://token.actions.githubusercontent.com


jobs:

  Generate-Attest-SBOM:
    name: Generate and Attest CycloneDX SBOM
    runs-on: ${{ inputs.runner }}

    permissions:
      contents: read
      id-token: write

    steps:

      # ------------------------------------------------------------
      # 1. Verify AWS CLI
      # ------------------------------------------------------------
      - name: Verify AWS CLI
        run: |
          aws --version

      # ------------------------------------------------------------
      # 2. Configure AWS credentials
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-ecr-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      # ------------------------------------------------------------
      # 3. Verify AWS identity
      # ------------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------------
      # 4. Login to PROD ECR
      # ------------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------------
      # 5. Install Cosign
      # ------------------------------------------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # ------------------------------------------------------------
      # 6. Display attestation information
      # ------------------------------------------------------------
      - name: Display attestation information
        run: |
          echo "Service:"
          echo "${{ inputs.service-name }}"

          echo "Image:"
          echo "${{ inputs.image-with-digest }}"

          echo "Expected certificate identity:"
          echo "${{ inputs.cosign-sbom-attestation-certificate-identity-regexp }}"

          echo "Expected OIDC issuer:"
          echo "${{ inputs.cosign-oidc-issuer }}"

      # ------------------------------------------------------------
      # 7. Check whether a valid CycloneDX attestation exists
      # ------------------------------------------------------------
      - name: Check existing CycloneDX attestation
        id: verify-attestation
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ inputs.image-with-digest }}"

          echo "Checking for an existing valid CycloneDX attestation..."
          echo "Image: $IMAGE"

          if cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity-regexp="${{ inputs.cosign-sbom-attestation-certificate-identity-regexp }}" \
            --certificate-oidc-issuer="${{ inputs.cosign-oidc-issuer }}" \
            "$IMAGE" >/tmp/cosign-attestation-output.json 2>/tmp/cosign-attestation-error.log
          then
            echo "A valid CycloneDX attestation already exists."
            echo "Skipping SBOM generation and attestation."

            echo "attestation-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No valid CycloneDX attestation was found."
            echo "SBOM generation and attestation are required."

            echo "attestation-exists=false" >> "$GITHUB_OUTPUT"

            if [[ -s /tmp/cosign-attestation-error.log ]]; then
              echo "Cosign verification output:"
              cat /tmp/cosign-attestation-error.log
            fi
          fi

      # ------------------------------------------------------------
      # 8. Generate CycloneDX SBOM only when required
      # ------------------------------------------------------------
      - name: Generate SBOM - CycloneDX
        if: steps.verify-attestation.outputs.attestation-exists == 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ inputs.image-with-digest }}
          format: cyclonedx
          output: sbom-image-${{ inputs.service-name }}-cdx.json

      # ------------------------------------------------------------
      # 9. Attest CycloneDX SBOM only when required
      # ------------------------------------------------------------
      - name: Cosign - Attest CycloneDX SBOM
        if: steps.verify-attestation.outputs.attestation-exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ inputs.image-with-digest }}"
          SBOM_FILE="sbom-image-${{ inputs.service-name }}-cdx.json"

          echo "Attesting CycloneDX SBOM:"
          echo "Image: $IMAGE"
          echo "SBOM: $SBOM_FILE"

          cosign attest \
            --yes \
            --predicate "$SBOM_FILE" \
            --type cyclonedx \
            "$IMAGE"

          echo "CycloneDX SBOM attestation completed."

      # ------------------------------------------------------------
      # 10. Upload generated SBOM only when generated
      # ------------------------------------------------------------
      - name: Upload SBOM
        if: steps.verify-attestation.outputs.attestation-exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-image-${{ inputs.service-name }}
          path: sbom-image-${{ inputs.service-name }}-cdx.json
          retention-days: 1

      # ------------------------------------------------------------
      # 11. Verify final attestation state
      # ------------------------------------------------------------
      - name: Verify final CycloneDX attestation
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ inputs.image-with-digest }}"

          echo "Verifying final CycloneDX attestation state..."

          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity-regexp="${{ inputs.cosign-sbom-attestation-certificate-identity-regexp }}" \
            --certificate-oidc-issuer="${{ inputs.cosign-oidc-issuer }}" \
            "$IMAGE" >/dev/null

          echo "Valid CycloneDX attestation confirmed for:"
          echo "$IMAGE"


      ##################################################################################################
      - name: Inspect final CycloneDX attestation
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ inputs.image-with-digest }}"

          echo "=============================================="
          echo "CycloneDX attestation"
          echo "=============================================="

          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity-regexp="${{ inputs.cosign-sbom-attestation-certificate-identity-regexp }}" \
            --certificate-oidc-issuer="${{ inputs.cosign-oidc-issuer }}" \
            "$IMAGE" \
            > /tmp/sbom-attestation.json

          echo
          echo "=============================================="
          echo "Attestation payload"
          echo "=============================================="

          jq -r '.payload' /tmp/sbom-attestation.json \
            | base64 -d \
            | jq .

          echo
          echo "=============================================="
          echo "Certificate information"
          echo "=============================================="

          jq '.signatures' /tmp/sbom-attestation.json
          ##########################################################################################################################
